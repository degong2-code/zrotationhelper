name: zrot-postlock-wcl-simc-omnium-numeric-identity
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/wcl_simc_multientry_omnium_audit_v1.py
      - .github/workflows/zrot-wcl-simc-omnium-identity.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Final source compile + synthetic semantics guard
        run: |
          set -euo pipefail
          python -m py_compile tools/research/wcl_simc_multientry_omnium_audit_v1.py
          python -B tools/research/wcl_simc_multientry_omnium_audit_v1.py >/tmp/omnium-selftest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/omnium-selftest.json'))
          assert d['status']=='PASS_OFFLINE_SYNTHETIC'
          assert d['checks']>=6
          assert d['actual_WCL_read'] is False
          assert d['validated_gameplay_priority'] is False
          print('OMNIUM_WCL_TALENT_NAMESPACE_SYNTHETIC=PASS')
          PY
          sha256sum tools/research/wcl_simc_multientry_omnium_audit_v1.py

  pinned-real-source-audit:
    runs-on: ubuntu-latest
    needs: [offline-regression]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-pinned
          sparse-checkout: |
            profiles/MID2/MID2_Warrior_Fury.simc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41463589665
          name: official-wcl-bounded-raw-and-lock-d1f2b82c9d4958fe3e28daafbe2530992d0c68e1
          path: /tmp/omnium-wcl-discovery
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41473060401
          name: wcl-disjoint-report-holdout-f2cb1e0f7f48e2978d1bce31e5c4eeeff303f54a
          path: /tmp/omnium-wcl-holdout
          github-token: ${{ github.token }}
      - name: Acquire pinned public talent tree snapshot and reconstruct WCL evidence ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib,urllib.request,json
          req=urllib.request.Request('https://www.raidbots.com/static/data/live/talents.json',
              headers={'User-Agent':'zRotationHelperPostLockOmniumResearch/1'})
          with urllib.request.urlopen(req,timeout=30) as f:blob=f.read(8000001)
          assert 100000<len(blob)<8000000
          actual=hashlib.sha256(blob).hexdigest()
          assert actual=='53bb1b612f140b666d66b75314db501bb1fa31923b66ad3f3cb02edbc5f3a07c',actual
          json.loads(blob)
          Path('/tmp/omnium-talent-db-pinned.json').write_bytes(blob)
          for cohort in ('discovery','holdout'):
              folder=Path('/tmp/omnium-wcl-'+cohort)
              paths=sorted(f for f in folder.rglob('*') if f.is_file())
              assert 1<=len(paths)<=40
              with ZipFile('/tmp/omnium-wcl-'+cohort+'.zip','w',ZIP_DEFLATED) as z:
                  for p in paths:z.write(p,arcname=str(p.relative_to(folder)))
          print('PUBLIC_TALENT_DB_AND_RAW_INPUT_SHA_GUARD=PASS')
          PY
      - name: Verify actual WCL node entries and SimC Omnium ID namespaces
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_simc_multientry_omnium_audit_v1.py \
            --profile simc-pinned/profiles/MID2/MID2_Warrior_Fury.simc \
            --tree-data /tmp/omnium-talent-db-pinned.json \
            --discovery-zip /tmp/omnium-wcl-discovery.zip \
            --holdout-zip /tmp/omnium-wcl-holdout.zip \
            --out /tmp/omnium-node-audit.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/omnium-node-audit.json'))
          assert a['schema']=='ZrotWclSimcPostlockMultientryOmniumEvidenceV1'
          assert a['talent_export_spec_id']==72
          assert len(a['simc_omnium_talent_ids'])==5
          assert a['priority_or_optimality_proven'] is False
          assert a['omnium_direct_WCL_mapping_proven'] is False
          assert a['trainer_mistake_classification']=='UNKNOWN'
          for role in ('discovery','holdout'):
              b=a[role]
              assert b['strict_pre_combatantinfo'] is True
              assert len(b['multientry_nodes'])>=1
              assert any(x['node_id']==110412 for x in b['multientry_nodes'])
              assert b['full_omnium_comparison']=='UNVERIFIED'
          print('REAL_POSTLOCK_OMNIUM_NUMERIC_NODE_EVIDENCE_PASS')
          print('ACTUAL_MULTIENTRY_NODE_DETAILS',json.dumps({
            role:a[role]['multientry_nodes'] for role in ('discovery','holdout')},
            ensure_ascii=False,sort_keys=True))
          print('OMNIUM_DIRECT_ID_FIELD_CROSSWALK',json.dumps(
            a['simc_omnium_talent_ids'],ensure_ascii=False,sort_keys=True))
          PY
      - name: Retain numeric structured receipt only (7 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postlock-omnium-node-evidence-${{ github.sha }}
          path: /tmp/omnium-node-audit.json
          retention-days: 7
          if-no-files-found: error
