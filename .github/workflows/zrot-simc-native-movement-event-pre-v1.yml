  real-native-foreground-source-oracle:
    needs: [offline-python-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMC_SHA: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-upstream
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert official source profile and native player source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C simc-upstream rev-parse HEAD)" = "$SIMC_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def gblob(path):
              raw=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert gblob('simc-upstream/engine/player/player.cpp')=='88e03a01ca87ff66fd3902c9d6e047fe1a03ecb8'
          assert gblob('simc-upstream/engine/buff/buff.cpp')=='6e9b1d8bcf6facea53d0f6e7ac573dfcf52e0a96'
          assert gblob('simc-upstream/engine/sim/cooldown.cpp')=='b73f7963ffc7434ee1aa0853e8335b39fe4cf96d'
          assert gblob('simc-upstream/engine/sim/sim.cpp')=='ae5c258953787196e0aecad58814ff14d4cd2bed'
          assert gblob('simc-upstream/engine/sim/raid_event.cpp')=='544316e502df365277d6f4ac876f2e767ced6d4a'
          assert gblob('simc-upstream/engine/action/action.cpp')=='399ecd9453b3f30bfc2ebf2b3ffd8f56cce8f8d4'
          assert gblob('simc-upstream/engine/action/action.hpp')=='19f1e8d31d6b7ea31c828e519735fafe83b8735d'
          assert gblob('simc-upstream/engine/sim/cooldown.hpp')=='d031d96592b635727f8c9c2b33b6d24b72190e89'
          assert gblob('simc-upstream/engine/player/player.hpp')=='f2648bec55750fce281e52185966d0424961a5c6'
          assert gblob('simc-upstream/engine/sim/sim.hpp')=='fb5632bb94e3285d197f3ed52ca3ae63ed3b5761'
          assert gblob('simc-upstream/engine/util/timespan.hpp')=='7662db9bbb64c2ccc5906058ff310fff64726cd5'
          assert gblob('simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc')=='3225992ed5b754ad5d61e8b785d9d859f1eed1be'
          print('SIMC_NATIVE_SOURCE_AND_PROFILE_PIN_PASS')
          PY
      - name: Install ccache for original and instrumented build
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: simc-ubuntu-gcc-b522cded8c26b97dac03fdf56e57a03ec7e8faa6-v1
      - name: Compile official pristine native SimC source
        shell: bash
        run: |
