              Path("simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc").read_bytes(),
              require_source=False)
          symbols=inventory(original_ir)
          assert symbols==["movement.distance","raid_event.movement.distance","raid_event.movement.in"]
          cases={}
          for label in ("st","2t"):
              before=Path("/tmp/pristine-native-move-"+label)
              after=Path("/tmp/instrumented-native-move-"+label)
              pristine=extract_json_sequence(before)
              instrumented=extract_json_sequence(after)
              assert pristine["status"]==instrumented["status"]=="SEQUENCE_SNAPSHOTS_EXTRACTED"
              assert pristine["source_apl_sha256"]==instrumented["source_apl_sha256"]
              assert pristine["source_profile_sha256"]==instrumented["source_profile_sha256"]
              assert pristine["precombat_sequence"]==instrumented["precombat_sequence"]
              assert pristine["combat_sequence"]==instrumented["combat_sequence"]
              trace=(after/"simc_native_log.txt").read_text(encoding="utf-8")
              grouped=group_environment_facts(trace,symbols)
              assert len(grouped)>0
              imminent=[g["facts"]["raid_event.movement.in"] for g in grouped
                        if 0<g["facts"]["raid_event.movement.in"]<30]
              if not imminent:
                  raise AssertionError("SIMC_MOVEMENT_FORECAST_EVENT_NOT_EXERCISED")
              moving=[g["facts"]["movement.distance"] for g in grouped
                      if g["facts"]["movement.distance"]>0]
              cases[label]={
                  "pristine_instrumented_action_sequence_exact":True,
                  "native_if_pre_observation_count":len(grouped),
                  "scheduled_event_in_window_observed":True,
                  "scheduled_event_min_positive_in_seconds":min(imminent),
                  "nonzero_actor_movement_PRE_observations":len(moving),
                  "max_observed_actor_movement_distance":max(moving,default=0.0),
                  "source_profile_and_apl_equal_within_case":True,
                  "scenario": "SimC LightMovement built-in generic fight style",
              }
          proof={
              "schema":"ZrotNativeGenericSimcLightMovementScenarioV1",
              "status":"GENERIC_MOVEMENT_NATIVE_NONPERTURBATION_AND_EVENT_FORECAST_OBSERVED",
              "scenarios":cases,
              "no_boss_specific_timeline_output":True,
              "future_event_not_real_WoW_state":True,
              "general_rotation_priority_validated":False,
              "Native_ready_independent":False,
              "WCL_API_calls":0,
          }
          Path("/tmp/native-generic-movement-scenario.json").write_text(
              json.dumps(proof,sort_keys=True,separators=(",",":"))+"\n")
          print("NATIVE_GENERIC_ACTIVE_MOVEMENT_EVENT_OBSERVED",json.dumps(cases,sort_keys=True))
          PY
          sha256sum /tmp/native-generic-movement-scenario.json
