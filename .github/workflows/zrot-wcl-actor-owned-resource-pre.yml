name: zrot-wcl-actor-owned-resource-pre-audit

on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/wcl_actor_resource_owner_strict_pre_v1.py
      - tools/research/wcl_actor_rage_predicate_evidence_v1.py
      - tools/research/wcl_aura_pre_to_simc_guard_v1.py
      - tools/research/wcl_source_action_family_readiness_v1.py
      - tools/research/wcl_trait_spell_replacement_gate_v1.py
      - docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/FURY_ACTION_FAMILY_MECHANICS_ADAPTER_V1.json
      - docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/AURA_PRE_SIMC_GUARD_FURY_FIXTURE_V1.json
      - docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/FURY_WCL_RAGE_PREDICATE_ADAPTER_EXPLORATORY_V1.json
      - .github/workflows/zrot-wcl-actor-owned-resource-pre.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-contract:
    name: Actor-owned PRE regression Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact source and prove enemy resource/same-time exclusion
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/research/wcl_actor_resource_owner_strict_pre_v1.py
          python -B tools/research/wcl_actor_resource_owner_strict_pre_v1.py >/tmp/resource-selftest.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/resource-selftest.json'))
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['checks']>=9 and r['WCL_live_API_calls']==0
          assert r['priority_claim'] is False
          print('ACTOR_OWNED_RESOURCE_STRICT_PRE_SYNTHETIC_PASS')
          PY
          sha256sum tools/research/wcl_actor_resource_owner_strict_pre_v1.py
          python -m py_compile tools/research/wcl_actor_rage_predicate_evidence_v1.py
          python -B tools/research/wcl_actor_rage_predicate_evidence_v1.py > /tmp/rage-predicate-selftest.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/rage-predicate-selftest.json'))
          assert o['status']=='PASS_OFFLINE_SYNTHETIC'
          assert o['checks']>=10 and o['actual_WCL_API_calls']==0
          assert o['manual_rotation_rule_proven'] is False
          print('ACTOR_RAGE_PREDICATES_AND_TENFOLD_SCALE_SYNTHETIC_PASS')
          PY
          sha256sum tools/research/wcl_actor_rage_predicate_evidence_v1.py
          python -m py_compile tools/research/wcl_aura_pre_to_simc_guard_v1.py
          python -B tools/research/wcl_aura_pre_to_simc_guard_v1.py >/tmp/aura-pre-selftest.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/aura-pre-selftest.json'))
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['checks']>=13 and r['live_API_calls']==0
          assert r['priority_rules_validated']==0
          assert r['wrong_cast_flags']==0
          print('STRICT_PRE_AURA_TRANSITION_INDEPENDENT_SYNTHETIC_PASS')
          PY
          sha256sum tools/research/wcl_aura_pre_to_simc_guard_v1.py
          python -m py_compile tools/research/wcl_source_action_family_readiness_v1.py
          python -B tools/research/wcl_source_action_family_readiness_v1.py >/tmp/action-family-selftest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/action-family-selftest.json'))
          assert d['status']=='PASS_OFFLINE_SYNTHETIC'
          assert d['checks']>=8
          assert d['priority_claims_proven']==0
          print('SIMC_SOURCE_ACTION_FAMILY_OFFLINE_CONTRACT_PASS')
          PY
          sha256sum tools/research/wcl_source_action_family_readiness_v1.py
          python -m py_compile tools/research/wcl_trait_spell_replacement_gate_v1.py
          python -B tools/research/wcl_trait_spell_replacement_gate_v1.py >/tmp/trait-gate-selftest.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/trait-gate-selftest.json'))
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['checks']>=9
          assert r['priority_claims_validated']==0
          print('STRICT_PRE_TALENT_REPLACEMENT_GATE_OFFLINE_PASS')
          PY
          sha256sum tools/research/wcl_trait_spell_replacement_gate_v1.py

  two-real-cohort-evidence:
    name: Independent WCL raw source/target actor resource gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [offline-contract]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original discovery report raw and frozen lock artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41463589665
          name: official-wcl-bounded-raw-and-lock-d1f2b82c9d4958fe3e28daafbe2530992d0c68e1
          path: /tmp/source-discovery
          github-token: ${{ github.token }}
      - name: Restore disjoint report holdout raw artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41473060401
          name: wcl-disjoint-report-holdout-f2cb1e0f7f48e2978d1bce31e5c4eeeff303f54a
          path: /tmp/source-holdout
          github-token: ${{ github.token }}
      - name: Repack identical verified source bytes into two zip envelopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          for name in ('discovery','holdout'):
              root=Path('/tmp/source-'+name)
              members=sorted(x for x in root.rglob('*') if x.is_file())
              assert 1<=len(members)<=40
              with ZipFile('/tmp/'+name+'-actor-resource.zip','w',ZIP_DEFLATED) as z:
                  for p in members:z.write(p,arcname=str(p.relative_to(root)))
          PY
      - name: Independently verify original raw hashes, PRE decisions, and corrected owned resource states
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_actor_resource_owner_strict_pre_v1.py \
            --discovery-zip /tmp/discovery-actor-resource.zip \
            --holdout-zip /tmp/holdout-actor-resource.zip \
            --out /tmp/actor-resource-provenance.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/actor-resource-provenance.json'))
          assert d['schema']=='ZrotActorOwnedWclResourceStrictPreCorrectionV1'
          assert d['wrong_owner_resource_contamination_prevented'] is True
          assert d['readiness_or_priority_verified'] is False
          assert d['actual_active_target_count']=='UNKNOWN'
          for role,raw,casts in (('discovery',17083,54),('holdout',9101,51)):
              r=d[role]
              assert r['raw_event_count']==raw
              assert r['actor_cast_count']==casts
              assert r['actor_owned_raw_resource_type_sample_counts'].keys()=={'1'}
              assert set(r['strict_pre_cast_coverage_by_raw_power_type'])=={'1'}
              assert r['wrong_or_unproven_owner_events_rejected'].get('DIFFERENT_TARGET',0)>=100
              assert r['casts_with_any_owned_strict_pre_snapshot']==casts-1
              assert r['resource_state_at_first_cast']=={}
              assert r['resource_cost_cooldown_charge_or_gcd_readiness']=='UNKNOWN'
              assert all(v['resource_pre'].get('3') is None for v in r['candidate_pre_snapshots'])
              assert all(all(x['source_timestamp']<v['timestamp'] for x in v['resource_pre'].values())
                         for v in r['candidate_pre_snapshots'])
          print('REAL_TWO_WCL_COHORT_ACTOR_RESOURCE_OWNER_STRICT_PRE_REVALIDATED=PASS')
          print('CORRECTED_RESOURCE_COUNTS',json.dumps({
            key:{k:d[key][k] for k in
              ('actor_cast_count','actor_owned_resource_snapshot_events',
               'wrong_or_unproven_owner_events_rejected','casts_with_any_owned_strict_pre_snapshot',
               'strict_pre_cast_coverage_by_raw_power_type')}
            for key in ('discovery','holdout')},sort_keys=True))
          PY
      - name: Retain compact actor-owned PRE diagnostics, not duplicate raw evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcl-actor-owned-strict-pre-${{ github.sha }}
          path: /tmp/actor-resource-provenance.json
          retention-days: 7
          if-no-files-found: error

  rage-predicate-real-evidence:
    name: Postlock real WCL Rage and aura PRE source predicate replay
    runs-on: ubuntu-latest
    needs: [offline-contract]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41463589665
          name: official-wcl-bounded-raw-and-lock-d1f2b82c9d4958fe3e28daafbe2530992d0c68e1
          path: /tmp/predicate-discovery
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41473060401
          name: wcl-disjoint-report-holdout-f2cb1e0f7f48e2978d1bce31e5c4eeeff303f54a
          path: /tmp/predicate-holdout
          github-token: ${{ github.token }}
      - name: Package exact original WCL evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          for name in ('discovery','holdout'):
              root=Path('/tmp/predicate-'+name)
              members=sorted(p for p in root.rglob('*') if p.is_file())
              assert 1<=len(members)<=40
              with ZipFile('/tmp/predicate-'+name+'.zip','w',ZIP_DEFLATED) as z:
                  for p in members:
                      z.write(p,arcname=str(p.relative_to(root)))
          PY
      - name: Independently reconstruct actor Rage scale and source APL predicates
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_actor_rage_predicate_evidence_v1.py \
            --adapter docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/FURY_WCL_RAGE_PREDICATE_ADAPTER_EXPLORATORY_V1.json \
            --discovery-zip /tmp/predicate-discovery.zip \
            --holdout-zip /tmp/predicate-holdout.zip \
            --out /tmp/wcl-rage-predicate-evidence.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wcl-rage-predicate-evidence.json'))
          assert d['schema']=='ZrotWclActorRageStrictPrePredicateEvidenceV1'
          assert d['status']=='EXPLORATORY_RAGE_SCALE_AND_AURA_OBSERVATION_NOT_READINESS'
          assert d['factor_patch_authority']=='NOT_MECHANIC_TRUTH_VERIFIED'
          assert d['actual_active_enemy_count']=='UNKNOWN'
          assert d['full_if_else_action_priority_eligible'] is False
          assert d['spell_cost_modifiers_and_cooldowns']=='UNKNOWN'
          assert d['dummy_mistake_flags']==0
          for name,n,raw,positive in (('discovery',54,17083,13),('holdout',51,9101,16)):
              r=d[name]
              assert r['actor_cast_count']==n and r['raw_event_count']==raw
              g=r['resource_scale_empirical']
              assert g['eligible_positive_raw_gain_events']==positive
              assert g['crossfield_compatible_positive_gain_events']==positive
              assert g['hypothesis_was_prelocked_on_independent_holdout'] is False
              assert len(r['records'])==n
              assert r['observed_rage_ge_100_counts']['TRUE']+r['observed_rage_ge_100_counts']['FALSE']==n-1
              assert sum(r['observed_recklessness_and_rage_ge_100_counts'].values())==n
              assert all(x['expected_action']=='UNKNOWN' and x['dummy_mistake_verdict']=='UNKNOWN' for x in r['records'])
              assert all(x['resource_source_timestamp']<x['timestamp']
                         for x in r['records'] if x['resource_source_timestamp'] is not None)
          print('REAL_WCL_105_CASTS_RAGE_AND_AURA_PRE_EVIDENCE_PASS')
          print('EXPLORATORY_PREDICATE_COUNTS',json.dumps({
             name:{k:d[name][k] for k in
                 ('observed_rage_ge_100_counts','observed_recklessness_buff_counts',
                  'observed_enrage_buff_counts','observed_recklessness_and_rage_ge_100_counts')}
             for name in ('discovery','holdout')},sort_keys=True))
          PY
      - name: Retrieve pinned source-derived SimC Slayer ordered-IF IR
        uses: actions/download-artifact@v4
        with:
          run-id: 41541463955
          name: simc-general-rotation-ordered-ifelse-ir-713905baad4d96bd2fbc033a4ee1c3fb793c5a4a
          path: /tmp/frozen-simc-ifelse-source
          github-token: ${{ github.token }}
      - name: Independent WCL actor aura transition replay and original source SimC AST guard
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_aura_pre_to_simc_guard_v1.py \
            --fixture docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/AURA_PRE_SIMC_GUARD_FURY_FIXTURE_V1.json \
            --adapter docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/FURY_WCL_RAGE_PREDICATE_ADAPTER_EXPLORATORY_V1.json \
            --source-ir /tmp/frozen-simc-ifelse-source/general-rotation-ifelse-research-ir.json \
            --discovery-zip /tmp/predicate-discovery.zip \
            --holdout-zip /tmp/predicate-holdout.zip \
            --out /tmp/wcl-aura-simc-strict-pre-guard.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/wcl-aura-simc-strict-pre-guard.json').read_bytes())
          assert obj['schema']=='ZrotWclAuraStrictPreSimcGuardAuditV1'
          assert obj['cast_rows_total']==105
          assert obj['same_timestamp_state_leakage'] is False
          assert obj['action_ready_and_priority_truth']=='UNKNOWN'
          assert obj['source_buff_duration_truth']=='UNVERIFIED'
          assert obj['resource_scaling_patch_truth']=='UNVERIFIED'
          assert obj['trainer_error_flags']==0
          for role,expected,affected in [('discovery',54,40),('holdout',51,34)]:
              v=obj[role]
              assert v['actor_casts']==expected
              assert v['aura_reconstruction']['same_tick_remove_apply_groups']==8
              assert v['aura_reconstruction']['same_tick_reapply_affected_casts']==affected
              assert v['aura_reconstruction'].get('independent_replay_true_mismatches',0)==0
              assert sum(v['source_apl_guard_counts'].values())==expected
              assert v['source_apl_guard_extracted_and_executed'] is True
              for cast in v['cast_records']:
                  assert cast['source_apl_action']=='rampage'
                  assert cast['source_apl_if']=='buff.recklessness.up&rage>=100'
                  assert cast['expected_spell']=='UNKNOWN'
                  assert cast['dummy_mistake_verdict']=='UNKNOWN'
                  assert cast['competing_action_readiness']=='UNKNOWN'
                  assert cast['active_target_count']=='UNKNOWN'
                  for name,proof in cast['aura_pre_provenance'].items():
                      if proof['source_timestamp'] is not None:
                          assert proof['source_timestamp']<cast['timestamp']
                      if proof['proof_status']=='PRE_REPLAY_MISMATCH_QUARANTINED':
                          assert proof['active'] is None
          print('REAL_105_CASTS_INDEPENDENT_AURA_PRE_AND_SOURCE_APL_AST_PASS')
          print('AURA_GUARD_COUNTS',json.dumps({
              role:{'source_guard':obj[role]['source_apl_guard_counts'],
                    'aura_diagnostics':obj[role]['aura_reconstruction']}
              for role in ('discovery','holdout')},sort_keys=True))
          PY
      - name: Preserve small dual-cohort original-source aura proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcl-source-apl-aura-strict-pre-${{ github.sha }}
          path: /tmp/wcl-aura-simc-strict-pre-guard.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain observed predicate evidence, no full raw archive duplication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcl-rage-predicate-observations-${{ github.sha }}
          path: /tmp/wcl-rage-predicate-evidence.json
          if-no-files-found: error
          retention-days: 7

  actual-action-family:
    runs-on: ubuntu-latest
    needs: [offline-contract]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-source-pinned
          sparse-checkout: |
            engine/class_modules/sc_warrior.cpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41463589665
          name: official-wcl-bounded-raw-and-lock-d1f2b82c9d4958fe3e28daafbe2530992d0c68e1
          path: /tmp/family-discovery
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41473060401
          name: wcl-disjoint-report-holdout-f2cb1e0f7f48e2978d1bce31e5c4eeeff303f54a
          path: /tmp/family-holdout
          github-token: ${{ github.token }}
      - name: Reconstruct original immutable raw evidence ZIP inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          for kind in ('discovery','holdout'):
              folder=Path('/tmp/family-'+kind)
              members=sorted(p for p in folder.rglob('*') if p.is_file())
              assert 1<=len(members)<=40
              with ZipFile('/tmp/family-'+kind+'.zip','w',ZIP_DEFLATED) as z:
                  for p in members:
                      z.write(p,arcname=str(p.relative_to(folder)))
          PY
      - name: Verify pinned SimC source IDs and replay WCL action families only
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_source_action_family_readiness_v1.py \
            --adapter docs/branches/BR-GR-ST2T-WCL-BLIND-20261102/FURY_ACTION_FAMILY_MECHANICS_ADAPTER_V1.json \
            --simc-source simc-source-pinned/engine/class_modules/sc_warrior.cpp \
            --discovery-zip /tmp/family-discovery.zip \
            --holdout-zip /tmp/family-holdout.zip \
            --out /tmp/wcl-action-family-replay.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wcl-action-family-replay.json'))
          assert d['schema']=='ZrotSourceBackedActionFamilyWclCastEvidenceV1'
          assert d['combined_actor_casts']==105
          assert d['source_simc_mechanics_git_blob_sha1']=='38ee3dd0d5943eb9227ec55aefb21e7d47244f96'
          assert d['original_numeric_lock_sha256']=='c5e2bedeb7f4f0152e8ba86a30b1b13ecc5aa1374af4c0b01237a16151a1c98e'
          assert d['priority_claims_proven']==0
          assert d['dummy_errors_confirmed']==0
          assert d['cooldown_or_charge_state_at_uncast_alternatives']=='UNKNOWN'
          for name,counts,casts in (
            ('discovery',{'1':30,'184367':9,'335096':2,'335097':6},54),
            ('holdout',{'1':24,'184367':8,'335096':2,'335097':5},51)):
              v=d[name]
              assert v['actor_cast_count']==casts
              assert v['numeric_blind_candidate_casts']==counts
              assert v['recognized_candidate_cast_total']==sum(counts.values())
              assert v['mechanic_cooldowns_or_charges_proven'] is False
              assert v['manual_keypress_proven'] is False
              assert v['competing_action_readiness_proven'] is False
              assert v['wrong_priority_flags']==0
              assert all(x['action_ready_strict_pre']=='UNKNOWN' for x in v['cast_records'])
              assert all(x['rotation_priority_proven'] is False for x in v['cast_records'])
          print('REAL_WCL_105_CASTS_SIMC_SOURCE_FAMILY_REPLAY_PASS')
          print('ACTION_FAMILY_COUNTS',json.dumps({
            n:d[n]['action_family_cast_totals'] for n in ('discovery','holdout')},sort_keys=True))
          print('REPEAT_CAST_GAPS_NOT_COOLDOWN',json.dumps({
            n:d[n]['observed_intercast_gaps_ms_only'] for n in ('discovery','holdout')},sort_keys=True))
          PY
      - name: Preserve concise numeric family and no-false-readiness receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postlock-wcl-simc-action-families-${{ github.sha }}
          path: /tmp/wcl-action-family-replay.json
          retention-days: 7
          if-no-files-found: error

  actual-talent-replacement-gates:
    runs-on: ubuntu-latest
    needs: [offline-contract]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41463589665
          name: official-wcl-bounded-raw-and-lock-d1f2b82c9d4958fe3e28daafbe2530992d0c68e1
          path: /tmp/trait-discovery
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41473060401
          name: wcl-disjoint-report-holdout-f2cb1e0f7f48e2978d1bce31e5c4eeeff303f54a
          path: /tmp/trait-holdout
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 41555742452
          name: postlock-wcl-simc-action-families-860e798f873b1a5c94de7d62369460a9dc61efdf
          path: /tmp/pinned-action-family
          github-token: ${{ github.token }}
      - name: Retrieve exact previously pinned 72-spec public trait metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib,json,urllib.request
          req=urllib.request.Request('https://www.raidbots.com/static/data/live/talents.json',
              headers={'User-Agent':'zRotationHelperPostLockTraitEvidence/1'})
          with urllib.request.urlopen(req,timeout=30) as resp:blob=resp.read(8_000_001)
          assert 100000<len(blob)<8000000
          digest=hashlib.sha256(blob).hexdigest()
          assert digest=='53bb1b612f140b666d66b75314db501bb1fa31923b66ad3f3cb02edbc5f3a07c',digest
          json.loads(blob)
          Path('/tmp/source-traits.json').write_bytes(blob)
          for name in ('discovery','holdout'):
              root=Path('/tmp/trait-'+name)
              files=sorted(p for p in root.rglob('*') if p.is_file())
              assert 1<=len(files)<=40
              with ZipFile('/tmp/trait-'+name+'.zip','w',ZIP_DEFLATED) as z:
                  for p in files:z.write(p,arcname=str(p.relative_to(root)))
          print('PINNED_WCL_AND_BLIZZARD_TRAIT_TREE_SNAPSHOT_REUSED')
          PY
      - name: Evaluate verified talent and aura replacement switch, never action readiness
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/wcl_trait_spell_replacement_gate_v1.py \
            --tree-data /tmp/source-traits.json \
            --source-family-receipt /tmp/pinned-action-family/wcl-action-family-replay.json \
            --discovery-zip /tmp/trait-discovery.zip \
            --holdout-zip /tmp/trait-holdout.zip \
            --out /tmp/trait-family-gate-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/trait-family-gate-proof.json').read_bytes())
          assert d['schema']=='ZrotWclSpecTraitEffectiveActionGateV1'
          assert d['total_casts']==105
          assert d['actual_competing_spell_cooldown_readiness']=='UNKNOWN'
          assert d['dummy_wrong_action_flags']==0
          for name,total in [('discovery',54),('holdout',51)]:
              r=d[name]
              assert r['casts_evaluated']==total
              assert sum(r['cast_replacement_gate_counts'].values())==total
              assert r['trait_numeric_precombat_evidence']['source']=='STRICT_PRE_COMBATANTINFO'
              assert r['any_gameplay_recommendation'] is False
              assert all(row['which_action_should_be_pressed']=='UNKNOWN' for row in r['recorded_cast_details'])
              assert all(row['base_bloodthirst_actual_cd_ready']=='UNKNOWN' for row in r['recorded_cast_details'])
          print('REAL_105_WCL_CASTS_TALENT_AURA_REPLACEMENT_GATE_VALIDATION_PASS')
          print('EFFECTIVE_REPLACEMENT_GATE_COUNTS',json.dumps({
              n:{'talent':d[n]['trait_numeric_precombat_evidence'],
                 'counts':d[n]['cast_replacement_gate_counts'],
                 'replacement_cast_gate_contradictions':d[n]['recorded_replacement_cast_with_false_gate']}
              for n in ('discovery','holdout')},sort_keys=True))
          PY
      - name: Preserve derived non-promoted trait-conditioned replacement evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: postlock-trait-conditioned-replacement-${{ github.sha }}
          path: /tmp/trait-family-gate-proof.json
          retention-days: 7
          if-no-files-found: error
