name: zrot-general-rotation-native-ir-evidence-join-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/general_rotation_native_ir_pre_evidence_join_v1.py
      - tools/research/general_rotation_native_pre_trace_compactor_v1.py
      - tools/research/general_rotation_source_hypothesis_ir_v1.py
      - tools/research/simc_native_if_false_priority_frontier_v1.py
      - tools/research/simc_native_decision_proof_bridge_v1.py
      - tools/research/general_rotation_simc_state_conditioned_evaluator_v1.py
      - tools/research/general_rotation_source_route_audit_v1.py
      - tools/research/general_rotation_source_route_fixture_v1.py
      - tools/research/general_rotation_original_pre_capture_engine_v1.py
      - tools/research/general_rotation_original_pre_capture_fixture_v1.py
      - tools/research/simc_native_warrior_priority_frontier_adapter_v1.py
      - .github/workflows/zrot-general-rotation-native-ir-evidence-join-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generic-static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.14']
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile generic evidence-to-source-IR join and reject forged identities
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/research/general_rotation_native_ir_pre_evidence_join_v1.py tools/research/general_rotation_source_route_audit_v1.py tools/research/general_rotation_source_route_fixture_v1.py
          python -m py_compile tools/research/general_rotation_original_pre_capture_engine_v1.py tools/research/general_rotation_original_pre_capture_fixture_v1.py
          python -m py_compile tools/research/simc_native_decision_proof_bridge_v1.py
          python -m py_compile tools/research/general_rotation_simc_state_conditioned_evaluator_v1.py
          python -B tools/research/simc_native_decision_proof_bridge_v1.py \
            >/tmp/gr-portable-adapter-source-bridge.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/gr-portable-adapter-source-bridge.json'))
          assert x['schema']=='ZrotSimcNativeGeneralRotationOpenWorldProofBridgeV1'
          assert x['status']=='PASS_OFFLINE_SYNTHETIC'
          assert x['portable_adapter_round_trip'] is True
          assert x['portable_gates_positive_READY']==0
          assert x['real_native']=='NOT_RUN'
          assert x['WCL_API_calls']==0
          print('GENERIC_SOURCE_GATE_TO_SPEC_ADAPTER_UNKNOWN_SAFE_ROUND_TRIP_PASS')
          PY
          python -B tools/research/general_rotation_original_pre_capture_engine_v1.py >/tmp/generic-pre-capture-synthetic.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/generic-pre-capture-synthetic.json'))
          assert r['schema']=='ZrotGeneralRotationOriginalPRECaptureContractV1'
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['checks']>=17
          assert r['positive_READY_certified']==0
          assert r['actual_source_producer_tested'] is False
          print('GENERIC_TYPED_ORIGINAL_PRE_CAPTURE_SELFTEST_PASS')
          PY
          python -B tools/research/general_rotation_source_route_audit_v1.py >/tmp/source-route-audit-synthetic.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/source-route-audit-synthetic.json'))
          assert r['schema']=='ZrotGeneralRotationSourceRouteObligationAuditV1'
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['synthetic_spec_count']>=2
          assert r['positive_READY_proven']==0
          print('GENERIC_ROUTE_AUDITOR_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_native_ir_pre_evidence_join_v1.py > /tmp/native-ir-join-synthetic.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/native-ir-join-synthetic.json'))
          assert r['schema']=='ZrotGeneralRotationNativeSourcePreIrEvidenceJoinV1'
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['checks']>=13
          assert r['same_timestamp_duplicate_occurrence_kept'] is True
          assert r['original_SimC_CXX_NOT_BUILT'] is True
          assert r['WCL_API_calls']==0
          print('GENERIC_SOURCE_IR_JOIN_SYNTHETIC_PASS')
          PY
          sha256sum tools/research/general_rotation_native_ir_pre_evidence_join_v1.py

  real-portable-native-ir-evidence:
    needs: [generic-static]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-upstream
          submodules: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-movement-event-pre-10beb978ba2444f9c195d73176845a15b74d3ff4
          path: /tmp/source-pinned-native-artifact
          run-id: 41797208028
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source PRE IF observations and source priority frontier into General Rotation IR
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_native_ir_pre_evidence_join_v1.py \
            --official-profile simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc \
            --profile-key warrior_fury --class-key warrior \
            --expected-profile-git-blob 3225992ed5b754ad5d61e8b785d9d859f1eed1be \
            --fixture-dir /tmp/source-pinned-native-artifact/native-portable-source-pre-fixture \
            --expected-manifest-sha256 44ac4316dcd718a42057832b45f6b6c746f8487462589a4513d177a38d16878a \
            --spec-adapter simc_native_warrior_priority_frontier_adapter_v1:WarriorPriorityAdapter \
            --export-gate-case moving_st --export-gate-at-ms 20031 \
            --out /tmp/native-to-general-rotation-ir-evidence-join.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/native-to-general-rotation-ir-evidence-join.json'))
          assert r['schema']=='ZrotGeneralRotationNativeSourcePreIrEvidenceJoinV1'
          x=r['source_gate_claim_export']
          assert x['schema']=='ZrotOriginalPortableSourceGateBundleAuditV1'
          assert x['case']=='moving_st' and x['decision_at_ms']==20031
          assert x['source_git_blob_sha1']=='3225992ed5b754ad5d61e8b785d9d859f1eed1be'
          assert x['claim_count']>0 and x['claim_count']<200
          assert x['ready_status_counts'].get('READY',0)==0
          assert x['source_virtual_ready_closed'] is False
          assert x['all_claims_source_row_and_occurrence_validated'] is True
          assert x['source_gate_provenance_upstream_raw_fixture_verified'] is True
          assert x['actual_original_native_action_selection_reproduced'] is False
          assert x['dummy_error_permitted'] is False
          assert all(y['bundle']['decision_at_ms']==20031
                     and not y['positive_route_closed']
                     and y['native_choice_only_comparator']
                     and y['independent_local_ready_decision'] in ('NOT_READY','UNKNOWN')
                     and len(y['bundle']['candidates'])==1
                     and y['bundle']['candidates'][0]['route']['closed'] is False
                     for y in x['claims'])
          print('ACTUAL_SOURCE_GATES_EXACT_PRE_SPEC_ADAPTER_BRIDGE_PASS',
                x['claim_count'],x['ready_status_counts'])
          assert r['source_IR_source_action_rows']==121
          assert len(r['cases'])==4
          c=r['totals']
          assert c['Native_action_ready_attempts']==5408
          assert c['source_IF_evaluations']==953
          assert c['PROVEN_TRUE']+c['PROVEN_FALSE']==939
          assert c['UNKNOWN']==14
          p=r['source_generic_proof_counts']
          assert p['proof_NOT_READY']==2313
          assert p['proof_UNKNOWN']==3095
          assert p.get('proof_READY',0)==0
          assert p['returned_APL_CONTROL']==213
          assert p['returned_EXECUTABLE_SOURCE_ACTION']==174
          assert p['returned_EXECUTABLE_SOURCE_ACTION_all_prior_excluded_but_winner_UNKNOWN']==79
          gap=r['source_positive_ready_preflight']
          assert gap['schema']=='ZrotSourcePinnedPositiveReadyGapPreflightV1'
          assert gap['candidate_count']==79
          assert gap['with_proven_nonempty_prior']+gap['vacuous_empty_prior']==79
          assert gap['positive_READY_certified']==0
          assert gap['complete_source_virtual_route_closure'] is False
          assert 1<=len(gap['bounded_cross_case_shortlist'])<=16
          assert all(row['source_row_sha256'] and row['physical_skill_READY']=='UNKNOWN'
                     and row['unproved_gates'] for row in gap['bounded_cross_case_shortlist'])
          # Exact original-source cohort regression: independently replayed
          # SYNC_LINE PRE numeric/pointer predicates must survive future
          # integration without promoting full Native READY or gameplay.
          assert p['independent_true_SYNC_LINE']>0
          selected=next((row for row in gap['bounded_cross_case_shortlist']
                         if row['case']=='moving_st' and row['at_simc_ms']==20031),None)
          assert selected is not None
          assert selected['source_action']=='rampage'
          assert selected['source_list']=='slayer' and selected['source_index']==6
          assert selected['source_row_sha256']=='217c49dcce32cbc0d975679ed09e0a79c71f05e2615e6566f46bffc9b1ffece2'
          assert selected['earlier_independent_NOT_READY']==6
          assert 'SYNC_LINE:MISSING' not in selected['unproved_gates']
          assert selected['physical_skill_READY']=='UNKNOWN'
          assert len(selected['unproved_gates'])==5
          sub=selected['original_PRE_postguard_subpredicates']
          assert sub['base_ready_movement_branch_bypassed'] is True
          assert sub['movement_option_matches_source_PRE'] is True
          assert sub['repeat_cast_rule_matches_source_PRE'] is True
          assert sub['movement_directionality']=='UNKNOWN'
          assert sub['movement_full_route']=='UNKNOWN'
          assert sub['cast_GCD_full_route']=='UNKNOWN'
          assert sub['original_source_virtual_ready_used_as_operand'] is False
          assert 'MOVEMENT:MISSING' in selected['unproved_gates']
          assert 'CAST_GCD:MISSING' in selected['unproved_gates']
          assert p['independent_source_postguard_subset']>0
          assert p['independent_source_moving_option_pass']>0
          assert p['independent_source_repeat_cast_pass']>0
          print('SOURCE_PINNED_ORIGINAL_POSTGUARD_SUBPREDICATES_PASS',
                selected['case'],selected['at_simc_ms'],selected['source_action'],sub)
          print('ACTUAL_ORIGINAL_SOURCE_SYNC_LINE_PARTIAL_POSITIVE_PASS',
                selected['case'],selected['at_simc_ms'],selected['source_action'],
                selected['unproved_gates'])
          print('SOURCE_PINNED_POSITIVE_READY_GAP_SHORTLIST',gap['bounded_cross_case_shortlist'][:3])
          assert r['Native_comparator_not_independent_IF_input'] is True
          assert r['complete_positive_ability_READY_proven'] is False
          assert r['WCL_independent_blind_holdout_proven'] is False
          assert r['real_target_dummy_error_proven'] is False
          assert r['WCL_API_calls']==0
          for label,case in r['cases'].items():
              print('ACTUAL_SOURCE_PRE_IR_JOIN_CASE',label,case['independent_AST_IF_outcomes'],
                    case['observed_source_rows_with_if'],
                    case['native_source_foreground_partial_prefix'])
          print('ACTUAL_SOURCE_PRE_IR_JOIN_TOTALS',c)
          print('REAL_PORTABLE_SOURCE_PRE_JOIN_TO_GENERIC_IR_PASS')
          PY
          sha256sum /tmp/native-to-general-rotation-ir-evidence-join.json
          python -B tools/research/general_rotation_source_route_fixture_v1.py \
            --source-root simc-upstream \
            --native-join /tmp/native-to-general-rotation-ir-evidence-join.json \
            --out /tmp/cross-spec-source-route-audit.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cross-spec-source-route-audit.json'))
          assert r['schema']=='ZrotGeneralRotationTwoSpecSourceRouteFixtureAuditV1'
          assert r['spec_fixture_count']==2
          assert r['one_generic_engine_two_source_fixtures'] is True
          assert r['positive_READY_certified']==0
          assert not r['dynamic_dispatch_and_guard_exhaustiveness_reviewed']
          assert r['audits']['warrior_fury']['source_method_nodes_verified']==6
          assert r['audits']['mage_arcane']['source_method_nodes_verified']==4
          assert all(x['action_READY']=='UNKNOWN' for x in r['audits'].values())
          assert r['actual_native_gap_example']['positive_READY']=='UNKNOWN'
          w=r['actual_native_gap_example']['generic_unmet_source_worklist']
          assert w['schema']=='ZrotGeneralRotationSourceObligationWorklistV1'
          assert w['missing_gate_count']==5
          assert 'BASE_VIRTUAL_COMPLETE' in w['gates_without_declared_method_sites']
          assert all(x['skill_READY']=='UNKNOWN' for x in w['required_source_evidence'])
          assert w['priority_or_dummy_error_permitted'] is False
          print('GENERIC_SOURCE_OBLIGATION_WORKLIST_PASS',
                [(x['gate'],len(x['source_site_candidates']))
                 for x in w['required_source_evidence']])
          print('ACTUAL_TWO_SPEC_SOURCE_ROUTE_AUDIT_PASS')
          PY
          sha256sum /tmp/cross-spec-source-route-audit.json
          python -B tools/research/general_rotation_original_pre_capture_fixture_v1.py \
            --route-report /tmp/cross-spec-source-route-audit.json \
            --out /tmp/general-rotation-original-pre-capture-plan.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/general-rotation-original-pre-capture-plan.json'))
          assert r['schema']=='ZrotGeneralRotationTwoSpecPRECaptureContractFixtureV1'
          assert r['spec_template_count']==2
          assert r['warrior_fury_template']['field_count']==12
          assert r['mage_arcane_template']['field_count']==8
          bound=r['source_selected_actual_warrior_capture_plan']
          assert bound['schema']=='ZrotGeneralRotationOriginalPREBoundRequestsV1'
          assert bound['source_missing_gate_count']==5
          assert bound['requested_operand_count']==12
          assert bound['gates_without_declared_operand_capture']==['BASE_VIRTUAL_COMPLETE']
          assert r['raw_capture_transport_validation']['records_transport_validated']==0
          assert r['raw_capture_transport_validation']['missing_request_count']==12
          assert r['raw_capture_producer_executed'] is False
          assert r['actual_arcane_native_E2E_executed'] is False
          assert r['positive_READY_certified']==0
          print('GENERIC_CROSS_SPEC_ORIGINAL_PRE_COLLECTION_CONTRACT_PASS')
          PY
          sha256sum /tmp/general-rotation-original-pre-capture-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: general-rotation-native-ir-evidence-join
          path: |
            /tmp/native-to-general-rotation-ir-evidence-join.json
            /tmp/cross-spec-source-route-audit.json
            /tmp/general-rotation-original-pre-capture-plan.json
          retention-days: 7
          if-no-files-found: error
