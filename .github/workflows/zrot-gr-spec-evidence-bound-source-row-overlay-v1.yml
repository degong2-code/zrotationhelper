name: zrot-gr-spec-evidence-bound-source-row-overlay-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/general_rotation_spec_native_root_evidence_overlay_v1.py
      - .github/workflows/zrot-gr-spec-evidence-bound-source-row-overlay-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generic-overlay-synthetic:
    strategy:
      fail-fast: false
      matrix:
        py: ['3.12','3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Verify generic model overlay compiles and denies fabricated READY and source rows
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/research/general_rotation_spec_native_root_evidence_overlay_v1.py \
            tools/research/general_rotation_spec_model_export_v1.py
          python -B tools/research/general_rotation_spec_native_root_evidence_overlay_v1.py \
            >/tmp/zrot-source-row-evidence-overlay-synthetic.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/zrot-source-row-evidence-overlay-synthetic.json'))
          assert x['status']=='PASS_GENERIC_NATIVE_ROOT_SOURCE_EVIDENCE_OVERLAY'
          assert x['positive_synthetic_roots']==1
          assert x['negative_rejected']==4
          assert x['source_order_preserved'] is True
          assert x['physical_ready_proven'] is False
          assert x['current_Retail_optimality_proven'] is False
          print('GENERIC_SOURCE_ROW_EVIDENCE_ONLY_OVERLAY_FAIL_CLOSED_PASS')
          PY
          sha256sum tools/research/general_rotation_spec_native_root_evidence_overlay_v1.py

  original-shaman-source-model-join:
    needs: [generic-overlay-synthetic]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse previous exact original pinned per-spec General Rotation draft
        uses: actions/download-artifact@v4
        with:
          run-id: 42747802703
          name: zrot-general-rotation-per-spec-source-drafts-923f49018aba12aefd97d2260e9f9697c6353ae4
          github-token: ${{ github.token }}
          path: /tmp/original-spec-drafts
      - name: Reuse actual Shaman 1T/3T same-root original SimC source select and PRE evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 42749660209
          name: zrot-gr-shaman-exact-root-pre-5a4ca0094f912868a0a16f005eff70bf7b6c4d56
          github-token: ${{ github.token }}
          path: /tmp/shaman-real-source-pre
      - name: Authenticate original different-run artifacts and bind Native roots by explicit target, source row and SHA
        shell: bash
        run: |
          set -euo pipefail
          echo '43ab52003608dd2aafcc0e3a44dd2a2f936ed767634c5e7ea36f476260a716e4  /tmp/original-spec-drafts/shaman_enhancement.json' | sha256sum -c -
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/shaman-real-source-pre')
          paths=list(root.rglob('selected-root-exact-pre-source-if.json'))
          assert len(paths)==2,paths
          expected={1:'79646b5c0799ce9a3c6fb0575db0e5b738f18d65c326b11fd9c593c1b676687c',
                    3:'504ed71c03f0b6e52eacbffcbf17968223cc8c56da9bfebdf2386e6274528013'}
          seen={}
          for path in paths:
              b=path.read_bytes()
              doc=json.loads(b)
              t=doc['targets']
              assert t in expected and t not in seen
              assert hashlib.sha256(b).hexdigest()==expected[t],(t,path)
              assert doc['source_spec']=='shaman_enhancement'
              assert doc['full_physical_READY_proven']==0
              (Path('/tmp')/f'shaman_native_root_{t}.json').write_bytes(b)
              seen[t]=len(doc['selected_source_IF_samples'])
          assert set(seen)=={1,3} and seen=={1:40,3:39},seen
          print('TWO_NATIVE_ORIGINAL_SHAMAN_SOURCE_ROOTS_EXACT_SHA_PROVEN',seen)
          PY
      - name: Complete first enhancement spec source-row evidence successor while preserving all 114 original priority rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/enhancement-evidence-bound-model
          python -B tools/research/general_rotation_spec_native_root_evidence_overlay_v1.py \
            --draft /tmp/original-spec-drafts/shaman_enhancement.json \
            --draft-sha256 43ab52003608dd2aafcc0e3a44dd2a2f936ed767634c5e7ea36f476260a716e4 \
            --native-root /tmp/shaman_native_root_1.json \
            --native-root-sha256 79646b5c0799ce9a3c6fb0575db0e5b738f18d65c326b11fd9c593c1b676687c \
            --native-root /tmp/shaman_native_root_3.json \
            --native-root-sha256 504ed71c03f0b6e52eacbffcbf17968223cc8c56da9bfebdf2386e6274528013 \
            --out /tmp/enhancement-evidence-bound-model/shaman_enhancement.evidence_bound.json \
            --markdown /tmp/enhancement-evidence-bound-model/shaman_enhancement.original_source_roots.md
          cat /tmp/original-spec-drafts/shaman_enhancement.md \
            > /tmp/enhancement-evidence-bound-model/shaman_enhancement.evidence_bound.md
          printf '\n\n---\n\n' \
            >> /tmp/enhancement-evidence-bound-model/shaman_enhancement.evidence_bound.md
          cat /tmp/enhancement-evidence-bound-model/shaman_enhancement.original_source_roots.md \
            >> /tmp/enhancement-evidence-bound-model/shaman_enhancement.evidence_bound.md
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/enhancement-evidence-bound-model')
          p=root/'shaman_enhancement.evidence_bound.json'
          x=json.loads(p.read_bytes())
          assert x['schema']=='ZrotGeneralRotationPerSpecializationResearchDraftV1'
          assert x['spec_key']=='shaman_enhancement'
          assert x['source_APL_rows_preserved']==114
          assert x['source_action_lists_preserved']==6
          program=x['general_rotation']['all_source_ordered_IF_ELSE_priority_lists']
          assert sum(map(len,program.values()))==114
          evidence=x['original_selected_root_evidence_successor']
          assert evidence['actual_source_selected_direct_count']==79
          assert evidence['actual_source_selected_initial_10s_count']==32
          assert evidence['condition_verdicts_at_exact_native_roots']=={
              'NO_IF':15,'TRUE_MATCH_NATIVE':5,'UNKNOWN':59}
          assert [case['observed_target_count'] for case in evidence['per_target_cases']]==[1,3]
          assert x['proof']['actual_native_SOURCE_selected_row']=='VERIFIED_FOR_EXACT_ROOTS_ONLY'
          assert x['proof']['strict_actual_same_root_PRE']=='SELECTED_SOURCE_FIELDS_ONLY'
          assert x['proof']['preceding_action_FULL_READY']=='UNKNOWN'
          assert x['proof']['current_Retail_priority_verified'] is False
          assert x['proof']['dummy_user_error_verdict']=='UNKNOWN'
          assert evidence['opener_end_transition']=='UNKNOWN'
          assert evidence['physical_ready_all_competitors']=='UNKNOWN'
          for name,rows in program.items():
              for row in rows:
                  assert row['positive_native_READY_certified']=='UNKNOWN'
                  assert row['WoW_expected_cast']=='UNKNOWN'
          print('SHAMAN_REAL_ORIGINAL_ST_AOE_SELECTED_SOURCE_ROOT_BIND_TO_ROTATION_MODEL_PASS',
                evidence['actual_source_selected_direct_count'],
                evidence['condition_verdicts_at_exact_native_roots'])
          for file in sorted(root.glob('*')):
              print('RESULT_MODEL_SHA256',hashlib.sha256(file.read_bytes()).hexdigest(),file.name)
          PY
      - name: Deliver completed source-row evidence successor as non-production research model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zrot-gr-shaman-source-row-evidence-model-${{ github.sha }}
          path: /tmp/enhancement-evidence-bound-model/
          retention-days: 14
          if-no-files-found: error
