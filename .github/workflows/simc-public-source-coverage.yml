name: Official SimC APL source coverage (pinned public source)

on:
  push:
    branches: [work/github-ci-bootstrap]
    paths:
      - "tools/research/simc_apl_source_engine.py"
      - "tools/research/simc_apl_syntax_inventory.py"
      - "tools/research/simc_apl_conditional_ir.py"
      - "tools/research/simc_apl_priority_trace.py"
      - "tools/research/simc_apl_decision_graph.py"
      - "tools/research/simc_apl_observability_contract.py"
      - "tools/research/simc_apl_semantic_resolver.py"
      - "tools/research/simc_apl_native_observability_gap.py"
      - "tools/research/simc_strict_pre_source_bridge.py"
      - "tools/research/simc_raw_transition_adapter.py"
      - "tools/research/simc_raw_transition_independent_audit.py"
      - "tools/research/simc_graph_shared_runtime_regression.py"
      - ".github/workflows/simc-public-source-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-apl-structural-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise generic engine on pinned public MID2 profiles
        shell: bash
        run: |
          set -euo pipefail
          python tools/research/simc_apl_decision_graph.py --self-test
          python tools/research/simc_apl_observability_contract.py --self-test
          python tools/research/simc_apl_semantic_resolver.py --self-test
          python tools/research/simc_apl_native_observability_gap.py --self-test
          python tools/research/simc_strict_pre_source_bridge.py --self-test
          python tools/research/simc_raw_transition_adapter.py --self-test
          python tools/research/simc_raw_transition_independent_audit.py
          python tools/research/simc_graph_shared_runtime_regression.py
          REV="710c2408bfd3ae4df71b8cd55cdf01f63fd6c926"
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/simulationcraft/simc/$REV/engine/util/util.cpp" -o "$RUNNER_TEMP/pinned-util.cpp"
          test -s "$RUNNER_TEMP/pinned-util.cpp"
          sha256sum "$RUNNER_TEMP/pinned-util.cpp" > "$RUNNER_TEMP/pinned-util.sha256"
          UTIL_SHA="$(sha256sum "$RUNNER_TEMP/pinned-util.cpp" | cut -d' ' -f1)"
          for entry in "enhancement MID2_Shaman_Enhancement" "fury MID2_Warrior_Fury" "unholy MID2_Death_Knight_Unholy" "havoc MID2_Demon_Hunter_Havoc"; do
            read -r SPEC PROFILE <<< "$entry"
            python tools/research/simc_apl_source_engine.py \
              --spec "$SPEC" \
              --upstream-revision "$REV" \
              --upstream-profile "profiles/MID2/$PROFILE.simc" \
              --out "$RUNNER_TEMP/$SPEC-model.json"
            python tools/research/simc_apl_conditional_ir.py \
              --source-model "$RUNNER_TEMP/$SPEC-model.json" \
              --out "$RUNNER_TEMP/$SPEC-ir.json"
            python tools/research/simc_apl_decision_graph.py \
              --source-ir "$RUNNER_TEMP/$SPEC-ir.json" \
              --out "$RUNNER_TEMP/$SPEC-decision-graph.json"
            python tools/research/simc_apl_observability_contract.py \
              --source-ir "$RUNNER_TEMP/$SPEC-ir.json" \
              --graph "$RUNNER_TEMP/$SPEC-decision-graph.json" \
              --out "$RUNNER_TEMP/$SPEC-observability.json"
            python tools/research/simc_apl_semantic_resolver.py \
              --requirements "$RUNNER_TEMP/$SPEC-observability.json" \
              --output "$RUNNER_TEMP/$SPEC-semantic-route.json"
            python tools/research/simc_apl_native_observability_gap.py \
              --requirements "$RUNNER_TEMP/$SPEC-observability.json" \
              --semantic-route "$RUNNER_TEMP/$SPEC-semantic-route.json" \
              --pinned-util-source "$RUNNER_TEMP/pinned-util.cpp" \
              --pinned-util-source-sha256 "$UTIL_SHA" \
              --output "$RUNNER_TEMP/$SPEC-native-observability-gaps.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          for spec,expected in (("enhancement",114),("fury",121),("unholy",None),("havoc",None)):
              model=json.loads((base/f"{spec}-model.json").read_text())
              ir=json.loads((base/f"{spec}-ir.json").read_text())
              graph=json.loads((base/f"{spec}-decision-graph.json").read_text())
              obs=json.loads((base/f"{spec}-observability.json").read_text())
              semantic=json.loads((base/f"{spec}-semantic-route.json").read_text())
              native_gaps=json.loads((base/f"{spec}-native-observability-gaps.json").read_text())
              assert model["source_kind"]=="SIMC_PUBLIC_REPO_INLINE_PROFILE_APL"
              assert model["actual_simc_executable_run"]=="NOT_RUN"
              actual_rows=model["apl_row_count"]
              assert actual_rows>0, (spec,actual_rows)
              if expected is not None:
                  assert actual_rows==expected,(spec,actual_rows)
              assert ir["total_rows"]==actual_rows and ir["all_rows_preserved"]
              assert ir["gameplay_rule_promotion"] is False
              assert ir["complete_simc_execution"] is False
              assert graph["source_apl_sha256"] == model["apl_sha256"]
              assert graph["source_row_count"] == actual_rows
              assert graph["all_source_rows_mapped"] is True
              assert len(graph["nodes"]) == actual_rows + len(ir["lists"])
              assert graph["entrypoint"] == "default:1"
              assert graph["gameplay_rule_promotion"] is False
              assert graph["actual_simc_priority_equivalence"] == "NOT_VALIDATED"
              assert graph["wcl_independent_validation"] == "NOT_RUN"
              assert len(graph["required_action_readiness_tokens"]) > 0
              assert obs["source_apl_sha256"] == model["apl_sha256"]
              assert semantic["source_apl_sha256"]==model["apl_sha256"]
              assert native_gaps["source_apl_sha256"]==model["apl_sha256"]
              assert native_gaps["source_operand_count"]==obs["operand_requirement_count"]
              assert native_gaps["all_action_tokens_unverified"]==obs["readiness_requirement_count"]
              assert (native_gaps["native_resource_grammar_candidates_not_bindings"]+
                      native_gaps["pinned_resource_label_collision_candidates_not_bindings"]+
                      native_gaps["other_operand_producer_semantics_unverified"]==
                      native_gaps["source_operand_count"])
              assert native_gaps["strict_pre_replay"]=="NOT_RUN"
              assert native_gaps["native_epoch_state_input"]=="NOT_CONNECTED_TO_THIS_SOURCE_APL"
              assert native_gaps["gameplay_rule_promotion"] is False
              assert all(o["decision_observation"]=="UNKNOWN" and
                         o["native_operand_feature_binding"] is None and
                         o["could_be_used_for_priority_trace"] is False
                         for o in native_gaps["source_operands"])
              assert all(a["ready"]=="UNKNOWN" and
                         a["cannot_be_skipped_as_unavailable"] is True
                         for a in native_gaps["required_action_readiness"])
              print(f"PUBLIC_SIMC_NATIVE_EVIDENCE_GAPS={spec} "
                    f"RESOURCE_GRAMMAR_CANDIDATES={native_gaps['native_resource_grammar_candidates_not_bindings']} "
                    f"BARE_RESOURCE_NAME_CANDIDATES={native_gaps['pinned_resource_label_collision_candidates_not_bindings']} "
                    f"OTHER_UNBOUND={native_gaps['other_operand_producer_semantics_unverified']} "
                    f"READY_UNKNOWN={native_gaps['all_action_tokens_unverified']} "
                    "VALIDATION=NO_NATIVE_APL_SEMANTIC_BINDING_YET")
              assert semantic["operand_count"]==obs["operand_requirement_count"]
              assert semantic["action_token_count"]==obs["readiness_requirement_count"]
              assert sum(semantic["grammar_family_counts"].values())==semantic["operand_count"]
              assert semantic["semantic_authority"]=="NOT_ESTABLISHED"
              assert semantic["gameplay_rule_promotion"] is False
              assert all(row["identity"]=="UNKNOWN" and row["observation_feature"] is None
                         for row in semantic["operands"])
              assert all(row["ready"]=="UNKNOWN" for row in semantic["readiness"])
              print(f"PUBLIC_SIMC_SEMANTIC_ROUTE={spec} "
                    f"CLASSIFIED={semantic['operand_count']-semantic['unknown_grammar_operand_count']} "
                    f"UNKNOWN_GRAMMAR={semantic['unknown_grammar_operand_count']} "
                    f"ACTIONS_UNKNOWN={semantic['action_token_count']} "
                    "VALIDATION=GRAMMAR_ONLY_NOT_MECHANIC_TRUTH")
              assert obs["source_row_count"] == actual_rows
              assert obs["operand_requirement_count"] == len(graph["required_state_operands"])
              assert obs["readiness_requirement_count"] == len(graph["required_action_readiness_tokens"])
              assert obs["actual_strict_pre_observation"] == "NOT_RUN"
              assert obs["gameplay_rule_promotion"] is False
              assert all(x["status"]=="UNKNOWN" and x["requirements_policy"]=="NOT_SUPPLIED"
                         for x in obs["required_action_readiness"])
              assert all(x["semantic_binding"]=="UNBOUND"
                         for x in obs["required_state_operands"])
              print(f"PUBLIC_SIMC_GENERIC_OBSERVABILITY={spec} "
                    f"OPERANDS={obs['operand_requirement_count']} "
                    f"READINESS={obs['readiness_requirement_count']} "
                    f"UNSUPPORTED_EXPRS={obs['unsupported_expression_count']} "
                    "VALIDATION=SOURCE_REQUIREMENTS_ONLY")
              for node in graph["nodes"].values():
                  if node["kind"] == "IF_ELSE_PRIORITY_ROW" and node["if_true"]["kind"] == "CHECK_ACTION_READINESS":
                      assert node["if_true"]["unknown"] == "BLOCK_READINESS_UNKNOWN"
              print(f"PUBLIC_SIMC_AUTOMATIC_DECISION_GRAPH={spec} ROWS={actual_rows} "
                    f"ACTIONS={graph['action_candidate_rows']} "
                    "VALIDATION=SOURCE_DERIVED_HYPOTHESIS_ONLY")
              print(f"PUBLIC_SIMC_SOURCE_IR={spec} ROWS={actual_rows} "
                    f"LISTS={len(ir['lists'])} "
                    f"GUARD_SYNTAX={ir['condition_expression_diagnostics']} "
                    "VALIDATION=PUBLIC_SOURCE_STRUCTURE_ONLY")
          PY
          python - <<'PY'
          """Real upstream APL runtime-boundary probe; NOT SimC executable output."""
          import json, os, subprocess, sys
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          engine=Path("tools/research/simc_apl_priority_trace.py")
          for spec in ("enhancement","fury"):
              model_path=base/f"{spec}-model.json"
              snapshot=base/f"{spec}-snapshot.json"
              snapshot.write_text(json.dumps({
                  "spec_slug":spec,
                  "decision_timestamp_ms":1000,
                  "transitions":[],
                  "operand_to_feature":{},
                  "readiness_feature_keys":{},
              }))
              cmd=[sys.executable,str(engine),"--model",str(model_path),
                   "--snapshot",str(snapshot)]
              run=subprocess.run(cmd,capture_output=True,text=True,check=True)
              ordinary=json.loads(run.stdout)
              graph_cmd=cmd+["--decision-graph",str(base/f"{spec}-decision-graph.json")]
              graph_run=subprocess.run(graph_cmd,capture_output=True,text=True,check=True)
              row=json.loads(graph_run.stdout)
              assert (row["status"],row["reason"],row["candidate_action_token"]) == (
                  ordinary["status"],ordinary["reason"],ordinary["candidate_action_token"])
              assert row["provenance"]["decision_graph_contract"] == "EXACT_SOURCE_RECOMPILATION"
              assert row["provenance"]["evaluation_engine"] == "SHARED_SIMC_APL_PRIORITY_TRACE"
              assert row["status"]=="BLOCKED",(spec,row)
              assert row["candidate_action_token"] is None,(spec,row)
              if spec=="fury":
                  assert row["reason"]=="AUTO_ATTACK_STATE_UNKNOWN",row
              print(f"PUBLIC_SIMC_APL_RUNTIME_BOUNDARY={spec} "
                    f"REASON={row['reason']} "
                    "PRIORITY_ACTION=NONE VALIDATION=REAL_SOURCE_SYNTHETIC_STATE_ONLY")
          # The first Fury APL action is auto_attack. We can skip it ONLY
          # when an actual timestamped PRE state explicitly says active.
          fury=base/"fury-snapshot.json"
          fury.write_text(json.dumps({
              "spec_slug":"fury","decision_timestamp_ms":1000,
              "transitions":[{"timestamp_ms":900,"key":"auto_active","value":1}],
              "operand_to_feature":{},"readiness_feature_keys":{},
              "control_feature_keys":{"auto_attack_active":"auto_active"}
          }))
          run=subprocess.run(
              [sys.executable,str(engine),"--model",str(base/"fury-model.json"),
               "--snapshot",str(fury)],capture_output=True,text=True,check=True)
          row=json.loads(run.stdout)
          assert row["status"]=="BLOCKED" and row["candidate_action_token"] is None
          assert any(e.get("status")=="ALREADY_ACTIVE_SKIP" for e in row["trace"])
          print("PUBLIC_SIMC_APL_AUTO_ATTACK_PRE_SKIP=PASS "
                "VALIDATION=REAL_SOURCE_SYNTHETIC_STATE_ONLY")
          PY

          python - <<'PY'
          # Exercise the new bridge against all four REAL pinned APL sources.
          # No real transition producer / readiness policy has been verified:
          # empty evidence MUST block every possible gameplay recommendation.
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,"tools/research")
          from simc_strict_pre_source_bridge import replay_explicit_pre, transition_digest
          base=Path(os.environ["RUNNER_TEMP"])
          for spec in ("enhancement","fury","unholy","havoc"):
              model=json.loads((base/f"{spec}-model.json").read_text())
              graph=json.loads((base/f"{spec}-decision-graph.json").read_text())
              fixture={
                  "schema":"ZrotSimcSourceAccountableStrictPreFixtureV1",
                  "spec":spec,"source_apl_sha256":model["apl_sha256"],
                  "source_profile_sha256":model.get("profile_sha256"),
                  "source_simc_executable_sha256":model.get("simc_executable_sha256"),
                  "gameplay_rule_promotion":False,
                  "provenance_class":"EXTERNAL_CALLER_DECLARED_UNVERIFIED",
                  "independently_verified_producer":False,
                  "decision_timestamp_ms":1000,"operand_to_feature":{},
                  "transitions":[],"transitions_sha256":transition_digest([]),
                  "unobservable_features":[],"synthetic_action_readiness":{},
              }
              r=replay_explicit_pre(model,fixture,graph=graph)
              assert r["trace_status"]=="BLOCKED",(spec,r["trace_status"],r["trace_reason"])
              assert r["trace_candidate_action_token"] is None
              assert r["native_simc_decision_time_state"]=="NOT_CAPTURED"
              assert r["gameplay_rule_promotion"] is False
              assert r["non_synthetic_readiness_all_unknown"]
              print("PUBLIC_SIMC_SOURCE_PRE_BRIDGE="+spec+" STATUS=BLOCKED"
                    " OBSERVED_OPERANDS=0 CLAIM=SYNTHETIC_EMPTY_STATE_ONLY")
          PY

          python - <<'PY'
          # Four real pinned SimC APLs, but ONLY synthetic raw feature-change
          # lines. No source identity mapping, no observed native PRE or readiness:
          # every playback MUST block; SHA projection is independently checked.
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,"tools/research")
          from simc_raw_transition_adapter import replay_from_raw
          root=Path(os.environ["RUNNER_TEMP"])
          for spec in ("enhancement","fury","unholy","havoc"):
              model=json.loads((root/f"{spec}-model.json").read_text())
              event={
                  "event_kind":"FEATURE_TRANSITION","event_id":"synthetic-marker",
                  "timestamp_ms":700,"sequence":0,
                  "feature_key":"synthetic_marker_only","value":7,
                  "scope":"ACTOR","valid":True,
              }
              raw=(json.dumps(event,sort_keys=True)+"\n").encode()
              capture={
                  "schema":"ZrotGenericRawFeatureTransitionCaptureV1",
                  "spec":spec,"source_apl_sha256":model["apl_sha256"],
                  "source_profile_sha256":model.get("profile_sha256"),
                  "source_simc_executable_sha256":model.get("simc_executable_sha256"),
                  "capture_kind":"SYNTHETIC_FEATURE_TRANSITIONS",
                  "capture_ref":"test:ci:"+spec,
                  "source_authority":"CALLER_SUPPLIED_UNVERIFIED",
                  "source_event_semantics":"FEATURE_CHANGE_NOT_SNAPSHOT",
                  "source_sha256":hashlib.sha256(raw).hexdigest(),
                  "source_bytes":len(raw),"gameplay_rule_promotion":False,
              }
              check=replay_from_raw(
                  model,capture,raw,decision_timestamp_ms=1000,
                  operand_to_feature={})
              assert check["independent_raw_recalculation"]["raw_record_count"]==1
              assert check["strict_pre_replay"]["trace_status"]=="BLOCKED"
              assert check["strict_pre_replay"]["trace_candidate_action_token"] is None
              assert check["strict_pre_replay"]["native_simc_decision_time_state"]=="NOT_CAPTURED"
              assert check["gameplay_rule_promotion"] is False
              print("PUBLIC_SIMC_RAW_EVENT_PRE_BOUNDARY="+spec+
                    " RAW_RECALC=PASS RECOMMENDATION=NONE"
                    " STATE=UNTRUSTED_SYNTHETIC_ONLY")
          PY
