name: zrot-simc-multi-spec-source-cold-start-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/general_rotation_simc_multi_spec_cold_start_v1.py
      - tools/research/general_rotation_source_hypothesis_ir_v1.py
      - tools/research/general_rotation_ir_proof_replay_v1.py
      - tools/research/general_rotation_decision_proof_engine_v1.py
      - tools/research/fixtures/general_rotation_simc_pinned_multi_spec_v1.json
      - tools/research/simc_apl_semantic_ir_v2.py
      - .github/workflows/zrot-simc-multi-spec-source-cold-start-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12','3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generic APL parser and exact source manifest synthetic checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/research/general_rotation_simc_multi_spec_cold_start_v1.py \
            tools/research/general_rotation_source_hypothesis_ir_v1.py \
            tools/research/general_rotation_ir_proof_replay_v1.py \
            tools/research/simc_apl_semantic_ir_v2.py
          python -B tools/research/simc_apl_semantic_ir_v2.py > /tmp/generic-source-ir-selftest.json
          python -B tools/research/general_rotation_simc_multi_spec_cold_start_v1.py > /tmp/multi-spec-manifest-selftest.json
          python -B tools/research/general_rotation_source_hypothesis_ir_v1.py > /tmp/general-rotation-ir-selftest.json
          python -B tools/research/general_rotation_ir_proof_replay_v1.py > /tmp/generic-ir-proof-replay-selftest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/multi-spec-manifest-selftest.json'))
          assert m['status']=='PASS_OFFLINE_SYNTHETIC'
          assert m['checks']>=8 and m['unrelated_class_examples']==2
          assert m['WCL_API_calls']==0
          ir=json.load(open('/tmp/general-rotation-ir-selftest.json'))
          assert ir['schema']=='ZrotGeneralRotationSourceHypothesisIRV1'
          assert ir['status']=='PASS_OFFLINE_SYNTHETIC'
          assert ir['checks']>=15 and ir['WCL_API_calls']==0
          print('GENERIC_TWO_CLASS_SOURCE_MANIFEST_SYNTHETIC_PASS')
          proof=json.load(open('/tmp/generic-ir-proof-replay-selftest.json'))
          assert proof['schema']=='ZrotGeneralRotationIRProofCarryingDecisionReplayV1'
          assert proof['status']=='PASS_OFFLINE_SYNTHETIC'
          assert proof['checks']>=15
          assert proof['generic_classes']==3
          assert proof['all_positive_READINESS_claims_synthetic_only'] is True
          assert proof['WCL_API_calls']==0
          print('GENERIC_GENERAL_ROTATION_SOURCE_IR_SYNTHETIC_PASS')
          print('GENERIC_PROOF_CARRYING_IR_REPLAY_SYNTHETIC_PASS')
          PY
          sha256sum tools/research/general_rotation_simc_multi_spec_cold_start_v1.py
          sha256sum tools/research/general_rotation_source_hypothesis_ir_v1.py
          sha256sum tools/research/general_rotation_ir_proof_replay_v1.py

  pinned-real-simc-profiles:
    needs: [portable-synthetic]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-upstream
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual pinned original Warrior and Mage APL semantic source cold-start
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_simc_multi_spec_cold_start_v1.py \
            --source-root simc-upstream \
            --manifest tools/research/fixtures/general_rotation_simc_pinned_multi_spec_v1.json \
            --out /tmp/general-rotation-multi-spec-source-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/general-rotation-multi-spec-source-receipt.json'))
          assert x['schema']=='ZrotGeneralRotationSimcMultiSpecColdStartV1'
          assert x['distinct_class_count']>=2
          assert len(x['profiles'])>=2
          assert x['total_action_rows']>0
          assert x['all_profile_source_blobs_verified'] is True
          assert x['Native_action_ready_independently_proven'] is False
          assert x['WCL_independent_blind_holdout_completed'] is False
          assert x['General_Rotation_opener_verified'] is False
          assert x['WCL_API_calls']==0
          print('ACTUAL_PINNED_MULTI_CLASS_SIMC_APL_SOURCE_COLD_START_PASS')
          for p in x['profiles']:
              print('PINNED_GENERIC_SPEC_SOURCE',p['key'],p['source_action_rows'],
                    p['action_list_count'],p['source_symbol_count'])
          PY
          sha256sum /tmp/general-rotation-multi-spec-source-receipt.json
      - name: Generate class-neutral General Rotation opener and priority source-hypothesis IR
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_source_hypothesis_ir_v1.py \
            --source-root simc-upstream \
            --manifest tools/research/fixtures/general_rotation_simc_pinned_multi_spec_v1.json \
            --out /tmp/general-rotation-two-class-hypothesis-ir.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/general-rotation-two-class-hypothesis-ir.json'))
          old=json.load(open('/tmp/general-rotation-multi-spec-source-receipt.json'))
          assert x['schema']=='ZrotMultiSpecGeneralRotationSourceHypothesisIRV1'
          assert x['class_count']==2
          assert x['source_action_rows_total']==old['total_action_rows']==172
          assert x['native_positive_ready_NOT_proven'] is True
          assert x['WCL_API_calls']==0 and x['MAIN_promoted'] is False
          for m in x['models']:
              c=m['coverage']
              assert c['source_action_rows']>0
              assert c['action_lists']>0
              assert m['opener_hypothesis']['first_actual_cast']=='UNKNOWN'
              assert m['opener_hypothesis']['runtime_opener_sequence']=='UNKNOWN'
              assert m['evidence_status']['complete_positive_READY_proven'] is False
              assert m['evidence_status']['validated_general_rotation_priority'] is False
              assert sum(len(v) for v in m['source_only_priority_graph']['lists'].values())==c['source_action_rows']
              print('REAL_GENERIC_SOURCE_HYPOTHESIS_IR',m['spec_key'],
                    c['source_action_rows'],c['action_lists'],
                    c['literal_target_count_comparisons'],
                    c['condition_context_hints'])
          print('GENERIC_SOURCE_OPENER_AND_PRIORITY_IR_SOURCE_ONLY_PASS')
          PY
          sha256sum /tmp/general-rotation-two-class-hypothesis-ir.json
      - name: Replay official Fury and Arcane IR with no invented PRE or READY
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_ir_proof_replay_v1.py \
            --source-root simc-upstream \
            --manifest tools/research/fixtures/general_rotation_simc_pinned_multi_spec_v1.json \
            --out /tmp/general-rotation-two-class-proof-replay.json
          python - <<'PY'
          import json
          source=json.load(open('/tmp/general-rotation-two-class-hypothesis-ir.json'))
          report=json.load(open('/tmp/general-rotation-two-class-proof-replay.json'))
          assert report['schema']=='ZrotMultiSpecGeneralRotationIRProofReplayV1'
          assert len(report['reports'])==len(source['models'])==2
          assert report['full_positive_ready_proven'] is False
          assert report['WCL_independent_holdout_completed'] is False
          assert report['WCL_API_calls']==0
          for model,case in zip(source['models'],report['reports']):
              assert model['spec_key']==case['source_spec']
              assert case['source_typed_graph_verified'] is True
              assert case['hypothetical_selected_source_row'] is None
              assert case['dummy_feedback_permitted'] is False
              assert case['source_order_optimality_proven'] is False
              assert case['candidate_proof_counts'].get('source_READY',0)==0
              assert sum(case['candidate_proof_counts'].values())==model['coverage']['source_action_rows']
              assert case['bounded_source_result']['verdict']=='UNKNOWN'
              print('OFFICIAL_GENERIC_IR_PROOF_REPLAY',case['source_spec'],
                    case['candidate_proof_counts'],
                    case['bounded_source_result'])
          print('ACTUAL_PINNED_IR_PROOF_REPLAY_FAIL_CLOSED_PASS')
          PY
          sha256sum /tmp/general-rotation-two-class-proof-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-two-class-simc-apl-source-ir
          path: |
            /tmp/general-rotation-multi-spec-source-receipt.json
            /tmp/general-rotation-two-class-hypothesis-ir.json
            /tmp/general-rotation-two-class-proof-replay.json
          retention-days: 7
          if-no-files-found: error
