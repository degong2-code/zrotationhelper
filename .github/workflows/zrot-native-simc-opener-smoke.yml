name: zrot-native-simc-opener-smoke

on:
  push:
    branches:
      - work/gr-native-simc-smoke-20261102
    paths:
      - .github/workflows/zrot-native-simc-opener-smoke.yml
      - tools/research/simc_native_reference_capture.py
      - tools/research/simc_native_json_sequence.py
      - tools/research/simc_native_performed_events.py
      - tools/research/simc_native_opener_window_v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-native-simc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIMC_COMMIT: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
    steps:
      - name: Checkout zRotationHelper without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream official SimulationCraft
        uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-upstream
          persist-credentials: false
          submodules: false
      - name: Pin exact source and profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C simc-upstream rev-parse HEAD)" = "$SIMC_COMMIT"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc")
          raw=p.read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert blob=="3225992ed5b754ad5d61e8b785d9d859f1eed1be",blob
          print("NATIVE_SRC_AND_PROFILE_PINS=PASS")
          PY
      - name: Install ccache
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - name: Restore compiler cache for same native source
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: simc-ubuntu-gcc-b522cded8c26b97dac03fdf56e57a03ec7e8faa6-v1
      - name: Build official SimC CLI once using pinned source
        shell: bash
        run: |
          set -euo pipefail
          ccache --max-size=2G
          cmake -S simc-upstream -B /tmp/zrot-simc-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTING=OFF -DSC_NO_NETWORKING=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/zrot-simc-build --target simc --parallel 3
          test -x /tmp/zrot-simc-build/simc
          /tmp/zrot-simc-build/simc display_build=2
          ccache --show-stats
      - name: Run official native CLI via existing pinned reference capture module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/native_simc
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc \
            --spec fury \
            --simc-bin /tmp/zrot-simc-build/simc \
            --out-dir ci_artifacts/native_simc/reference \
            --timeout 180
          test -s ci_artifacts/native_simc/reference/simc_reference_receipt.json
          test -s ci_artifacts/native_simc/reference/simc_native_log.txt
          test -s ci_artifacts/native_simc/reference/simc_native_sequence.json
          test -s ci_artifacts/native_simc/reference/simc_effective_actions.simc
      - name: Independently extract native event records and structured JSON2 action state
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/simc_native_reference_capture.py --self-test
          python -B tools/research/simc_native_json_sequence.py --self-test
          python -B tools/research/simc_native_performed_events.py --self-test
          python -B tools/research/simc_native_opener_window_v1.py --self-test
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools/research")
          from simc_native_performed_events import extract_native_reference
          from simc_native_json_sequence import extract_json_sequence
          from simc_native_opener_window_v1 import build as build_opener
          folder=Path("ci_artifacts/native_simc/reference")
          source=json.loads((folder/"simc_reference_receipt.json").read_text())
          seq=extract_json_sequence(folder)
          performed=extract_native_reference(folder)
          opener=build_opener(folder,expected_spec="fury",window_seconds=15.)
          assert source["status"]=="SIMC_NATIVE_CAPTURED_UNPARSED"
          assert seq["source_capture_status"]=="SIMC_NATIVE_CAPTURED_UNPARSED"
          assert seq["source_apl_sha256"]==source["effective_apl_sha256"]
          assert seq["combat_count"]>0,seq["status"]
          assert performed["performed_event_count"]>0,performed["status"]
          assert performed["status"]=="NATIVE_PERFORMED_EVENT_SYNTAX_EXTRACTED"
          assert opener["actual_SimC_executable_capture"] is True
          assert opener["precombat_observed_record_count"]>0
          assert opener["opener_observed_action_count"]>0
          assert opener["snapshot_state_is_not_strict_PRE"] is True
          assert opener["ready_for_target_dummy_mistake_feedback"] is False
          assert opener["WCL_ranker_validation"]=="NOT_RUN"
          first=[
            {"time_ms":a["timestamp_ms"],
             "token":a.get("action_token"),"id":a.get("spell_id")}
            for a in performed["performed_events"]
            if a["timestamp_ms"]>=0
          ][:20]
          report={
            "schema":"ZrotNativeSimcVerifiedSourceExecutionReceiptV1",
            "result":"PASS_OFFICIAL_CLI_EXECUTED_WITH_REFERENCE_MODULE",
            "upstream_commit":"b522cded8c26b97dac03fdf56e57a03ec7e8faa6",
            "profile_git_blob_sha1":"3225992ed5b754ad5d61e8b785d9d859f1eed1be",
            "native_executable_sha256":source["simc_executable_sha256"],
            "native_profile_sha256":source["profile_sha256"],
            "native_effective_apl_sha256":source["effective_apl_sha256"],
            "native_log_sha256":source["native_log_sha256"],
            "native_json2_sha256":source["native_json2_sha256"],
            "performed_event_count":performed["performed_event_count"],
            "json2_precombat_count":seq["precombat_count"],
            "json2_combat_count":seq["combat_count"],
            "true_JSON2_precombat_count":opener["precombat_observed_record_count"],
            "observed_first_15_seconds_count":opener["opener_observed_action_count"],
            "observed_first_15_seconds_actions":[{"timestamp_ms":x["timestamp_ms"],"token":x["action_token"],"id":x["numeric_spell_id"]} for x in opener["opener_observed_actions"][:30]],
            "observed_opener_queue_failed_records":opener["opener_queue_failed_record_count"],
            "observed_opener_wait_records":opener["opener_wait_record_count"],
            "native_JSON2_snapshot_is_not_strict_PRE":True,
            "combat_opener_sequence_complete":"NOT_PROVEN",
            "first_native_performed_actions":first,
            "native_extractor_format_basis":performed["format_reference_upstream_commit"],
            "native_extractor_format_equivalence":performed["native_executable_format_equivalence"],
            "native_action_sequence_not_paired_to_WCL":True,
            "strict_pre_readiness_for_WCL":"NOT_RECONSTRUCTED",
            "actual_WCL_high_ranker_validation":"NOT_RUN",
            "player_ready_General_Rotation":"NOT_PROVEN",
            "target_dummy_feedback":"NOT_RUN",
            "production_authority_promoted":False,
          }
          Path("ci_artifacts/native_simc/receipt.json").write_text(
             json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print("NATIVE_SIMC_REFERENCE_CAPTURE_JSON2_AND_PERFORMS=PASS")
          print("NATIVE_ACTIONS_FIRST_20="+str(first))
          PY
      - name: Publish small receipt only (not raw source logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-simc-verified-${{ github.sha }}
          path: ci_artifacts/native_simc/receipt.json
          retention-days: 7
          if-no-files-found: warn
