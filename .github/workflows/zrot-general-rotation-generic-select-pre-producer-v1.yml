      - name: Independently compare original root PRE AST with real Native IF return
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from general_rotation_original_root_if_bridge_v1 import corroborate
          source=json.load(open('/tmp/zrot-original-root-actor-pre-producer.json'))
          native=json.load(open('/tmp/zrot-original-native-if-bridge-producer.json'))
          report={}
          for spec,prof in (
              ('fury','MID2_Warrior_Fury.simc'),
              ('arcane','MID2_Mage_Arcane.simc')):
              profile=Path('simc-upstream/profiles/MID2/'+prof).read_bytes()
              for mode in ('st','2t'):
                  name=spec+'-'+mode
                  directory=spec if mode=='st' else spec+'-2t'
                  trace=Path('/tmp/zrot-instrumented-'+directory+
                      '/simc_native_log.txt').read_text(encoding='utf8')
                  temporal=json.load(open(
                      '/tmp/zrot-source-temporal-frontier-'+name+'.json'))
                  proof=corroborate(trace,profile,temporal,source,native)
                  assert proof['exact_original_action_ready_roots']==temporal['original_ready_calls']
                  assert proof['independent_full_action_ready_proven']==0
                  assert proof['source_order_complete'] is False
                  assert proof['WCL_API_calls']==0
                  if proof['independent_ast_vs_original_native_if_conflicts']:
                      raise AssertionError('ORIGINAL_IF_AST_PARITY_CONFLICT:'+name)
                  Path('/tmp/zrot-native-root-if-proof-'+name+'.json').write_text(
                      json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n')
                  assert proof['native_if_parity_status'] in (
                      'SOURCE_AST_NATIVE_IF_NONZERO_MATCH_OBSERVED',
                      'UNKNOWN_NO_ORIGINAL_NATIVE_IF_OVERLAP')
                  report[name]={
                      'native_if_parity_status':proof['native_if_parity_status'],
                      'independent_source_PRE_native_IF_comparisons':
                          proof['native_if_independent_positive_comparison_count'],
                      'counts':proof['status_counts']}
                  print('ACTUAL_ORIGINAL_ROOT_NATIVE_IF_COMPARISON_BOUNDED',
                        name,report[name],flush=True)
          Path('/tmp/zrot-native-root-if-proof-summary.json').write_text(
              json.dumps({
                  'schema':'ZrotOriginalRootNativeIFST2TComparisonSummaryV1',
                  'cases':report,'native_IF_is_post_only':True,
                  'independent_full_READY_proven':0,
                  'WCL_API_calls':0},sort_keys=True,separators=(',',':'))+'\n')
          PY
          sha256sum /tmp/zrot-native-root-if-proof-summary.json
