name: zrot-general-rotation-generic-select-pre-producer-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/general_rotation_select_pre_passive_producer_v1.py
      - tools/research/general_rotation_select_pre_source_adapter_v1.py
      - tools/research/general_rotation_method_pre_passive_producer_v1.py
      - tools/research/general_rotation_method_pre_passive_replay_v1.py
      - tools/research/general_rotation_source_false_guard_engine_v1.py
      - tools/research/general_rotation_controlled_negative_profile_v1.py
      - tools/research/general_rotation_call_scope_instrument_v1.py
      - tools/research/general_rotation_call_scope_replay_v1.py
      - tools/research/general_rotation_apl_eligibility_instrument_v1.py
      - tools/research/general_rotation_apl_eligibility_replay_v1.py
      - tools/research/general_rotation_apl_init_guard_probe_v1.py
      - tools/research/general_rotation_apl_init_guard_replay_v1.py
      - tools/research/general_rotation_select_pre_passive_replay_v1.py
      - tools/research/general_rotation_original_pre_capture_engine_v1.py
      - tools/research/general_rotation_original_pre_capture_fixture_v1.py
      - .github/workflows/zrot-general-rotation-generic-select-pre-producer-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-source-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and verify non-executable producer and replay contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/research/general_rotation_select_pre_passive_producer_v1.py tools/research/general_rotation_select_pre_passive_replay_v1.py tools/research/general_rotation_select_pre_source_adapter_v1.py tools/research/general_rotation_method_pre_passive_producer_v1.py tools/research/general_rotation_method_pre_passive_replay_v1.py tools/research/general_rotation_source_false_guard_engine_v1.py
          python -m py_compile tools/research/general_rotation_call_scope_instrument_v1.py tools/research/general_rotation_call_scope_replay_v1.py tools/research/general_rotation_controlled_negative_profile_v1.py
          python -m py_compile tools/research/general_rotation_apl_eligibility_instrument_v1.py tools/research/general_rotation_apl_eligibility_replay_v1.py
          python -B tools/research/general_rotation_apl_eligibility_instrument_v1.py > /tmp/zrot-apl-eligibility-producer-synthetic.json
          python -B tools/research/general_rotation_apl_eligibility_replay_v1.py > /tmp/zrot-apl-eligibility-replay-synthetic.json
          python - <<'PY'
          import json
          for path,schema in (
              ('/tmp/zrot-apl-eligibility-producer-synthetic.json',
               'ZrotGenericOriginalActionInitializationEligibilityProducerV1'),
              ('/tmp/zrot-apl-eligibility-replay-synthetic.json',
               'ZrotGenericOriginalAPLInitializationEligibilityStrictReplayV1')):
              r=json.load(open(path))
              assert r['schema']==schema
              assert r['status']=='PASS_OFFLINE_SYNTHETIC'
              assert r['positive_READY_certified']==0
          print('GENERIC_ORIGINAL_APL_INIT_AND_FOREGROUND_INVENTORY_SYNTHETIC_PASS')
          PY
          python -m py_compile tools/research/general_rotation_apl_init_guard_probe_v1.py tools/research/general_rotation_apl_init_guard_replay_v1.py
          python -B tools/research/general_rotation_apl_init_guard_probe_v1.py > /tmp/zrot-generic-init-guard-probe-selftest.json
          python -B tools/research/general_rotation_apl_init_guard_replay_v1.py > /tmp/zrot-generic-init-guard-replay-selftest.json
          python - <<'PY'
          import json
          for path,schema in (
              ('/tmp/zrot-generic-init-guard-probe-selftest.json',
               'ZrotGenericOriginalActionInitGuardReturnProbeV1'),
              ('/tmp/zrot-generic-init-guard-replay-selftest.json',
               'ZrotGenericOriginalActionInitGuardReturnStrictReplayV1')):
              v=json.load(open(path))
              assert v['schema']==schema
              assert v['status']=='PASS_OFFLINE_SYNTHETIC'
              assert v['positive_READY_certified']==0
              assert v['WCL_API_calls']==0
          print('GENERIC_ORIGINAL_ACTION_INIT_GUARD_SHORT_CIRCUIT_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_controlled_negative_profile_v1.py > /tmp/zrot-controlled-negative-profile-selftest.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/zrot-controlled-negative-profile-selftest.json'))
          assert p['schema']=='ZrotGeneralRotationControlledNegativeNativeProfileFixtureV1'
          assert p['status']=='PASS_OFFLINE_SYNTHETIC'
          assert p['positive_READY_certified']==0
          assert p['WCL_API_calls']==0
          print('GENERIC_NEGATIVE_PROFILE_TRANSFORM_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_call_scope_instrument_v1.py >/tmp/generic-call-instrument-synthetic.json
          python -B tools/research/general_rotation_call_scope_replay_v1.py >/tmp/generic-call-replay-synthetic.json
          python - <<'PY'
          import json
          for path,schema in (
              ('/tmp/generic-call-instrument-synthetic.json',
               'ZrotGenericOriginalReadyCallScopeTraceProducerV1'),
              ('/tmp/generic-call-replay-synthetic.json',
               'ZrotGenericOriginalReadyCallScopeStrictReplayV1')):
              r=json.load(open(path))
              assert r['schema']==schema and r['status']=='PASS_OFFLINE_SYNTHETIC'
              assert r['positive_READY_certified']==0
              assert r['WCL_API_calls']==0
          print('GENERIC_STRICT_METHOD_CALL_SCOPE_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_source_false_guard_engine_v1.py >/tmp/generic-false-guard-synthetic.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/generic-false-guard-synthetic.json'))
          assert r['schema']=='ZrotGenericOriginalPRECertifiedNegativeGuardRulesV1'
          assert r['status']=='PASS_OFFLINE_SYNTHETIC'
          assert r['positive_action_READY_certified']==0
          print('GENERIC_CERTIFIED_FALSE_RETURN_EVALUATOR_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_method_pre_passive_producer_v1.py > /tmp/generic-method-producer-selftest.json
          python -B tools/research/general_rotation_method_pre_passive_replay_v1.py > /tmp/generic-method-replay-selftest.json
          python - <<'PY'
          import json
          for p,s in (
              ('/tmp/generic-method-producer-selftest.json',
               'ZrotGenericOriginalMethodEntryPREPassiveProducerV1'),
              ('/tmp/generic-method-replay-selftest.json',
               'ZrotGenericOriginalMethodEntryPREReplayV1')):
              x=json.load(open(p))
              assert x['schema']==s
              assert x['status']=='PASS_OFFLINE_SYNTHETIC'
              assert x['positive_READY_certified']==0
              assert x['WCL_API_calls']==0
          print('GENERIC_METHOD_ENTRY_PRE_SYNTHETIC_PASS')
          PY
          python -B tools/research/general_rotation_select_pre_passive_producer_v1.py > /tmp/generic-producer-selftest.json
          python -B tools/research/general_rotation_select_pre_passive_replay_v1.py > /tmp/generic-replay-selftest.json
          python - <<'PY'
          import json
          for f, schema in (
            ('generic-producer-selftest.json','ZrotGeneralRotationGenericSelectPREPassiveProducerV1'),
            ('generic-replay-selftest.json','ZrotGeneralRotationGenericSelectPREReplayV1')
          ):
              p=json.load(open('/tmp/'+f))
              assert p['status']=='PASS_OFFLINE_SYNTHETIC'
              assert p['schema']==schema and p['positive_READY_certified'] == 0 if 'positive_READY_certified' in p else p['full_READY_proven'] is False
              assert p['WCL_API_calls']==0
          print('GENERIC_PASSIVE_SOURCE_PRE_PRODUCER_AND_REPLAYER_STATIC_PASS')
          PY

  actual-two-spec-original-vs-instrumented:
    needs: generic-source-offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: simc-upstream
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm original official SimC source is pinned
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C simc-upstream rev-parse HEAD)" = "b522cded8c26b97dac03fdf56e57a03ec7e8faa6"
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools/research')
          from general_rotation_source_route_audit_v1 import git_blob
          assert git_blob(Path('simc-upstream/engine/player/player.cpp').read_bytes())=='88e03a01ca87ff66fd3902c9d6e047fe1a03ecb8'
          print('SIMC_GENERIC_PRE_SOURCE_PIN_PASS')
          PY
      - name: Install and cache original source build compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: simc-ubuntu-gcc-b522cded8c26b97dac03fdf56e57a03ec7e8faa6-v1
      - name: Compile pristine official Native SimC
        shell: bash
        run: |
          set -euo pipefail
          ccache --max-size=2G
          cmake -S simc-upstream -B /tmp/zrot-generic-pre-native-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTING=OFF -DSC_NO_NETWORKING=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/zrot-generic-pre-native-build --target simc --parallel 3
          test -x /tmp/zrot-generic-pre-native-build/simc
          cp /tmp/zrot-generic-pre-native-build/simc /tmp/zrot-original-uninstrumented-simc
          test -x /tmp/zrot-original-uninstrumented-simc
      - name: Capture pristine two-spec actual Native 30-second action sequences
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc \
            --spec fury --simc-bin /tmp/zrot-generic-pre-native-build/simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-pristine-fury --timeout 180
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/MID2_Mage_Arcane.simc \
            --spec arcane --simc-bin /tmp/zrot-generic-pre-native-build/simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-pristine-arcane --timeout 180
      - name: Apply same generic passive source producer once to both classes
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_select_pre_source_adapter_v1.py \
            --simc-root simc-upstream --out /tmp/zrot-generic-source-templates.json
          python -B tools/research/general_rotation_source_false_guard_engine_v1.py \
            --simc-root simc-upstream \
            --source-templates /tmp/zrot-generic-source-templates.json \
            --out /tmp/zrot-generic-false-guard-contract.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-false-guard-contract.json'))
          assert r['rule_count']==2 and r['full_action_ready_certified']==0
          assert {x['source_method_key'] for x in r['source_rules']} == {
              'rampage_ready','arcane_blast_ready'}
          import copy,sys
          sys.path.insert(0,'tools/research')
          from general_rotation_source_false_guard_engine_v1 import (
              verify_rules,assess_method_entry,FalseGuardError,FALSE,UNKNOWN,PRE
          )
          from general_rotation_original_pre_capture_engine_v1 import digest
          manifest=json.load(open('/tmp/zrot-generic-source-templates.json'))
          certified=verify_rules(r,manifest)
          weapon=certified['rampage_ready']
          mage=certified['arcane_blast_ready']
          def sample(rule,fields):
              return {
                  'source_method_key':rule['source_method_key'],
                  'source_method_body_sha256':rule['source_method_body_sha256'],
                  'capture_phase':PRE,'raw_fields':fields}
          assert assess_method_entry(
              sample(weapon,{'main_hand_weapon_none':True,
                             'off_hand_weapon_none':False}),certified
          )['method_return_verdict']==FALSE
          assert assess_method_entry(
              sample(weapon,{'main_hand_weapon_none':False,
                             'off_hand_weapon_none':False}),certified
          )['method_return_verdict']==UNKNOWN
          assert assess_method_entry(
              sample(mage,{'prismatic_bolt_buff_up':True}),certified
          )['method_return_verdict']==FALSE
          assert assess_method_entry(
              sample(mage,{'prismatic_bolt_buff_up':False}),certified
          )['method_return_verdict']==UNKNOWN
          forged=copy.deepcopy(r)
          forged['source_rules'][0]['source_guard_false_witness_sha256']='0'*64
          forged.pop('ruleset_sha256')
          forged['ruleset_sha256']=digest(forged)
          try:verify_rules(forged,manifest)
          except FalseGuardError:pass
          else:raise AssertionError('SELF_HASHED_FORGED_SOURCE_GUARD_ACCEPTED')
          print('ACTUAL_SOURCE_WITNESS_AND_SYNTHETIC_NEGATIVE_GUARD_PASS')
          print('ACTUAL_SIMC_TWO_SPEC_PINNED_FALSE_RETURN_RULES_PASS')
          PY
          python -B tools/research/general_rotation_select_pre_passive_producer_v1.py \
            --simc-root simc-upstream \
            --source-templates /tmp/zrot-generic-source-templates.json \
            --receipt /tmp/zrot-generic-select-pre-source-patch.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-select-pre-source-patch.json'))
          assert r['schema']=='ZrotGeneralRotationGenericSelectPREPassiveProducerV1'
          assert r['field_count']==3
          assert r['original_action_ready_call_count']==1
          assert r['new_action_ready_calls']==0
          assert r['CXX_compiled'] is False
          assert r['native_behavior_nonperturbation']=='NOT_TESTED'
          assert r['positive_READY_proven']==0
          print('GENERIC_SOURCE_PATCH_PRODUCER_OUTPUT_PASS')
          PY
      - name: Instrument pinned Original C++ method entry sites without new readiness calls
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_method_pre_passive_producer_v1.py \
            --simc-root simc-upstream \
            --source-templates /tmp/zrot-generic-source-templates.json \
            --receipt /tmp/zrot-generic-method-pre-patch.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-method-pre-patch.json'))
          assert r['schema']=='ZrotGenericOriginalMethodEntryPREPassiveProducerV1'
          assert r['source_phase']=='SIMC_ORIGINAL_METHOD_PRE'
          assert r['source_method_count']==6
          assert set(r['source_method_sites']) == {
              'base_action','base_ready','warrior_action',
              'warrior_ready','rampage_ready','arcane_blast_ready'
          }
          assert r['requested_original_method_PRE_operands']==7
          assert r['new_original_ready_or_virtual_calls']==0
          assert r['native_compiled_and_executed'] is False
          assert r['positive_READY_certified']==0
          print('SOURCE_PINNED_CXX_ORIGINAL_METHOD_ENTRY_INSTRUMENTED')
          PY
      - name: Build and run source-pinned controlled negative fixture on pristine SimC
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_controlled_negative_profile_v1.py \
            --simc-root simc-upstream \
            --source-templates /tmp/zrot-generic-source-templates.json \
            --certified-false-guards /tmp/zrot-generic-false-guard-contract.json \
            --scenario-id fury_rampage_missing_offhand \
            --out-profile simc-upstream/profiles/MID2/Zrot_Controlled_Fury_NoOffhand.simc \
            --receipt /tmp/zrot-controlled-fury-no-offhand-provenance.json
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/Zrot_Controlled_Fury_NoOffhand.simc \
            --spec fury --simc-bin /tmp/zrot-original-uninstrumented-simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-original-fury-no-offhand --timeout 180
          echo ORIGINAL_SOURCE_CONTROLLED_NEGATIVE_FIXTURE_NATIVE_CAPTURE_PASS
      - name: Scope every original action-ready invocation and nested method call
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_call_scope_instrument_v1.py \
            --simc-root simc-upstream \
            --source-templates /tmp/zrot-generic-source-templates.json \
            --select-pre-receipt /tmp/zrot-generic-select-pre-source-patch.json \
            --method-pre-receipt /tmp/zrot-generic-method-pre-patch.json \
            --receipt /tmp/zrot-generic-call-scope-patch.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-call-scope-patch.json'))
          assert r['schema']=='ZrotGenericOriginalReadyCallScopeTraceProducerV1'
          assert r['source_method_count']==6
          assert r['original_action_ready_call_count']==1
          assert r['new_action_ready_calls']==0
          assert r['method_PRE_marker_call_id_appended'] is True
          assert r['source_select_skip_marker']=='ZROT_GENERIC_SELECT_SKIP_V1|'
          assert r['native_cxx_compiled'] is False
          print('SOURCE_PINNED_GENERIC_INVOCATION_RAII_PATCH_PASS')
          PY
      - name: Instrument original APL init and source foreground membership inventory
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_apl_eligibility_instrument_v1.py \
            --simc-root simc-upstream \
            --previous-call-scope-receipt /tmp/zrot-generic-call-scope-patch.json \
            --receipt /tmp/zrot-generic-apl-eligibility-patch.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-apl-eligibility-patch.json'))
          assert r['schema']=='ZrotGenericOriginalActionInitializationEligibilityProducerV1'
          assert r['source_stage_count']==2
          assert r['source_action_ready_call_count_delta']==0
          assert r['positive_FULL_action_READY_proven']==0
          print('SOURCE_PINNED_GENERIC_APL_ELIGIBILITY_INIT_PATCH_PASS')
          PY
      - name: Observe actual original action init eligibility guard return values
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/research/general_rotation_apl_init_guard_probe_v1.py \
            --simc-root simc-upstream \
            --init-inventory-receipt /tmp/zrot-generic-apl-eligibility-patch.json \
            --prior-call-scope-receipt /tmp/zrot-generic-call-scope-patch.json \
            --receipt /tmp/zrot-generic-action-init-guards-patch.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/zrot-generic-action-init-guards-patch.json'))
          assert r['schema']=='ZrotGenericOriginalActionInitGuardReturnProbeV1'
          assert r['original_guard_short_circuit_order_preserved'] is True
          assert r['source_guard_call_count_delta']==0
          assert r['positive_action_READY_proven']==0
          print('SOURCE_PINNED_GENERIC_ORIGINAL_ACTION_INIT_GUARD_WITNESS_PASS')
          PY
      - name: Rebuild patched Native SimC and capture same two independent specs
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/zrot-generic-pre-native-build --target simc --parallel 3
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/MID2_Warrior_Fury.simc \
            --spec fury --simc-bin /tmp/zrot-generic-pre-native-build/simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-instrumented-fury --timeout 180
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/MID2_Mage_Arcane.simc \
            --spec arcane --simc-bin /tmp/zrot-generic-pre-native-build/simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-instrumented-arcane --timeout 180
          python -B tools/research/simc_native_reference_capture.py \
            --profile simc-upstream/profiles/MID2/Zrot_Controlled_Fury_NoOffhand.simc \
            --spec fury --simc-bin /tmp/zrot-generic-pre-native-build/simc \
            --targets 1 --seed 31459 --fight-seconds 30 \
            --out-dir /tmp/zrot-instrumented-fury-no-offhand --timeout 180
      - name: Independently replay actual Generic SELECT-PRE records and verify exact action parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from simc_native_json_sequence import extract_json_sequence
          from general_rotation_select_pre_passive_replay_v1 import parse_marker_lines
          from general_rotation_method_pre_passive_replay_v1 import replay as method_replay
          from general_rotation_call_scope_replay_v1 import replay as scope_replay
          from general_rotation_apl_eligibility_replay_v1 import replay as eligibility_replay
          from general_rotation_apl_init_guard_replay_v1 import replay as init_guard_replay
          guard_report=json.load(open('/tmp/zrot-generic-action-init-guards-patch.json'))
          init_report=json.load(open('/tmp/zrot-generic-apl-eligibility-patch.json'))
          scope_report=json.load(open('/tmp/zrot-generic-call-scope-patch.json'))
          negative_rules=json.load(open('/tmp/zrot-generic-false-guard-contract.json'))
          report=json.load(open('/tmp/zrot-generic-select-pre-source-patch.json'))
          method_report=json.load(open('/tmp/zrot-generic-method-pre-patch.json'))
          template_manifest=json.load(open('/tmp/zrot-generic-source-templates.json'))
          cases={}
          for spec,profile in (
              ('fury','MID2_Warrior_Fury.simc'),
              ('arcane','MID2_Mage_Arcane.simc')):
              original=extract_json_sequence(Path('/tmp/zrot-pristine-'+spec))
              patched=extract_json_sequence(Path('/tmp/zrot-instrumented-'+spec))
              assert original['status']==patched['status']=='SEQUENCE_SNAPSHOTS_EXTRACTED'
              assert original['source_profile_sha256']==patched['source_profile_sha256']
              assert original['source_apl_sha256']==patched['source_apl_sha256']
              assert original['combat_sequence']==patched['combat_sequence']
              assert original['precombat_sequence']==patched['precombat_sequence']
              native_trace=Path('/tmp/zrot-instrumented-'+spec+'/simc_native_log.txt').read_text(encoding='utf8')
              prof=Path('simc-upstream/profiles/MID2/'+profile).read_bytes()
              a=parse_marker_lines(native_trace,report,prof)
              assert a['original_select_PRE_attempt_count']>0
              assert a['original_select_PRE_marker_count']==a['original_select_PRE_attempt_count']*3
              assert a['source_method_entry_PRE_proven'] is False
              assert a['positive_READY_certified']==0
              m=method_replay(native_trace,method_report,template_manifest,prof,negative_rules)
              scoped=scope_replay(native_trace,prof,template_manifest,
                                  scope_report,negative_rules)
              eligible=eligibility_replay(native_trace,prof,init_report)
              original_init_guards=init_guard_replay(native_trace,prof,guard_report)
              assert original_init_guards['source_mapped_init_guard_invocations_total']>0
