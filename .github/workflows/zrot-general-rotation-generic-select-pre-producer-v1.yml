      - name: Prove observed time-scoped source frontiers in ST and 2-target Native
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from simc_native_json_sequence import extract_json_sequence
          from general_rotation_call_scope_replay_v1 import replay as scoped_replay
          from general_rotation_apl_eligibility_replay_v1 import replay as init_replay
          from general_rotation_apl_init_guard_replay_v1 import replay as guard_replay
          from general_rotation_source_eligibility_decision_ir_v1 import compose as source_ir
          from general_rotation_time_scoped_priority_ir_v1 import compose as time_ir
          read=lambda p:json.loads(Path(p).read_bytes())
          init_source=read('/tmp/zrot-generic-apl-eligibility-patch.json')
          guard_source=read('/tmp/zrot-generic-action-init-guards-patch.json')
          scope_source=read('/tmp/zrot-generic-call-scope-patch.json')
          sweep_source=read('/tmp/zrot-generic-select-sweep-patch.json')
          adapter=read('/tmp/zrot-generic-source-templates.json')
          negative_rules=read('/tmp/zrot-generic-false-guard-contract.json')
          report={}
          for spec,profile_name in (
              ('fury','MID2_Warrior_Fury.simc'),
              ('arcane','MID2_Mage_Arcane.simc')):
              profile=Path('simc-upstream/profiles/MID2/'+profile_name).read_bytes()
              for variant,n in (('st',1),('2t',2)):
                  suffix=spec if n==1 else spec+'-2t'
                  before=extract_json_sequence(Path('/tmp/zrot-pristine-'+suffix))
                  after=extract_json_sequence(Path('/tmp/zrot-instrumented-'+suffix))
                  assert before['status']==after['status']=='SEQUENCE_SNAPSHOTS_EXTRACTED'
                  assert before['source_profile_sha256']==after['source_profile_sha256']
                  assert before['source_apl_sha256']==after['source_apl_sha256']
                  assert before['precombat_sequence']==after['precombat_sequence']
                  assert before['combat_sequence']==after['combat_sequence']
                  trace=Path('/tmp/zrot-instrumented-'+suffix+'/simc_native_log.txt').read_text(encoding='utf8')
                  scopes=scoped_replay(trace,profile,adapter,scope_source,
                      negative_rules,sweep_source)
                  initialized=init_replay(trace,profile,init_source)
                  guards=guard_replay(trace,profile,guard_source)
                  staged=source_ir(profile,initialized,guards,scopes)
                  temporal=time_ir(profile,staged,scopes,target_count=n)
                  assert temporal['source_sweep_count']==scopes['source_selection_sweeps_observed']
                  assert temporal['original_ready_calls']==scopes['selected_action_ready_original_calls']
                  assert temporal['target_count']==n
                  assert temporal['independent_FULL_READY_proven']==0
                  assert temporal['source_order_complete'] is False
                  assert temporal['dummy_error_permitted'] is False
                  assert temporal['WCL_independent_blind_candidate_lock_maintained'] is True
                  assert len(temporal['early_observed_selection_frontiers'])>0
                  assert all(x['conditional_priority_verdict']=='UNKNOWN'
                             for x in temporal['observed_time_scoped_selection_frontiers'])
                  name=spec+'-'+variant
                  Path('/tmp/zrot-source-temporal-frontier-'+name+'.json').write_text(
                      json.dumps(temporal,sort_keys=True,separators=(',',':'))+'\n')
                  report[name]={
                      'target_count':n,
                      'original_vs_instrumented_action_sequence_exact':True,
                      'source_sweeps':temporal['source_sweep_count'],
                      'nested_sweeps':temporal['nested_source_sweep_count'],
                      'same_timestamp_multiple_sweeps':
                          temporal['same_timestamp_multiple_distinct_sweeps'],
                      'actual_action_ready_calls':temporal['original_ready_calls'],
                      'Native_post_true':temporal['native_post_comparator_true'],
                      'Native_post_false':temporal['native_post_comparator_false'],
                      'full_READY_proven':0,'source_priority_complete':False}
                  print('ACTUAL_GENERIC_TEMPORAL_SOURCE_PRIORITY_ST_2T_PASS',
                        name,report[name],flush=True)
          result={
              'schema':'ZrotGenericTimeScopedSourcePriorityST2TNativeCohortV1',
              'status':'REAL_NATIVE_SOURCE_SWEEP_ST2T_A_B_PASS',
              'cases':report,'independent_FULL_READY_proven':0,
              'source_order_complete':False,'WCL_API_calls':0}
          Path('/tmp/zrot-time-scoped-st2t-summary.json').write_text(
              json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
