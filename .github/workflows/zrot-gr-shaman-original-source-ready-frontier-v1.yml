name: zrot-gr-shaman-original-source-ready-frontier-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json
      - tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json
      - tools/research/fixtures/zrot_shaman_priority_frontier_v1.json
      - tools/research/general_rotation_original_select_extra_pre_v1.py
      - tools/research/general_rotation_original_attempt_frontier_v1.py
      - tools/research/general_rotation_original_candidate_stage_v1.py
      - tools/research/general_rotation_original_candidate_stage_replay_v1.py
      - tools/research/general_rotation_original_runtime_membership_v1.py
      - tools/research/general_rotation_original_runtime_membership_replay_v1.py
      - tools/research/general_rotation_original_action_lifecycle_v1.py
      - tools/research/general_rotation_original_action_lifecycle_replay_v1.py
      - .github/workflows/zrot-gr-shaman-original-source-ready-frontier-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generic-pre-source-contract:
    strategy:
      fail-fast: false
      matrix:
        py: ['3.12','3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Generic source reader syntax and scope regression plus external Shaman plan validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/research/general_rotation_original_select_extra_pre_v1.py \
            tools/research/general_rotation_original_select_extra_pre_replay_v1.py \
            tools/research/general_rotation_original_attempt_frontier_v1.py \
            tools/research/general_rotation_original_candidate_stage_v1.py \
            tools/research/general_rotation_original_candidate_stage_replay_v1.py \
            tools/research/general_rotation_original_runtime_membership_v1.py \
            tools/research/general_rotation_original_runtime_membership_replay_v1.py \
            tools/research/general_rotation_original_action_lifecycle_v1.py \
            tools/research/general_rotation_original_action_lifecycle_replay_v1.py \
            tools/research/general_rotation_original_dispatch_if_replay_v1.py \
            tools/research/simc_original_select_if_pre_witness_v1.py
          python -B tools/research/general_rotation_original_select_extra_pre_v1.py >/tmp/generic-pre-selftest.json
          python -B tools/research/general_rotation_original_select_extra_pre_replay_v1.py >/tmp/generic-pre-replay-selftest.json
          python -B tools/research/general_rotation_original_attempt_frontier_v1.py >/tmp/native-frontier-selftest.json
          python -B tools/research/general_rotation_original_candidate_stage_v1.py >/tmp/candidate-stage-patch-selftest.json
          python -B tools/research/general_rotation_original_candidate_stage_replay_v1.py >/tmp/candidate-stage-replay-selftest.json
          python -B tools/research/general_rotation_original_runtime_membership_v1.py >/tmp/runtime-membership-patch-selftest.json
          python -B tools/research/general_rotation_original_runtime_membership_replay_v1.py >/tmp/runtime-membership-replay-selftest.json
          python -B tools/research/general_rotation_original_action_lifecycle_v1.py >/tmp/lifecycle-patcher-selftest.json
          python -B tools/research/general_rotation_original_action_lifecycle_replay_v1.py >/tmp/lifecycle-replay-selftest.json
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'tools/research')
          from simc_original_select_if_pre_witness_v1 import plan_check
          from general_rotation_original_select_extra_pre_v1 import valid_plan
          legacy=json.load(open('tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json'))
          extra=json.load(open('tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json'))
          plan_check(legacy);valid_plan(extra)
          assert len(extra['profiles'])==1 and extra['profiles'][0]['actor_class']=='shaman'
          assert 1<=len(extra['fields'])<=24 and extra['fields'][0]['symbol']=='active_enemies'
          assert extra['profiles'][0]['profile_git_blob']=='2f2c951ae07489d124db36c464ab66d1efd262ce'
          assert json.load(open('/tmp/generic-pre-selftest.json'))['result']=='PASS_SYNTHETIC_STATIC'
          assert json.load(open('/tmp/generic-pre-replay-selftest.json'))['status']=='PASS_SYNTHETIC_STATIC'
          frontier=json.load(open('/tmp/native-frontier-selftest.json'))
          assert frontier['status']=='PASS_SYNTHETIC_STATIC'
          assert frontier['negatives_rejected']>=9 and frontier['physical_READY_proven']==0
          assert frontier['native_calls_added']==0 and frontier['WCL_API_calls']==0
          stage_patch=json.load(open('/tmp/candidate-stage-patch-selftest.json'))
          stage_replay=json.load(open('/tmp/candidate-stage-replay-selftest.json'))
          assert stage_patch['status']=='PASS_SYNTHETIC_STATIC' and stage_patch['negative_controls']>=6
          assert stage_patch['added_original_ready_calls']==0 and stage_patch['added_native_RNG_calls']==0
          assert stage_replay['status']=='PASS_SYNTHETIC_STATIC' and stage_replay['negative_controls']>=7
          assert stage_replay['unobserved_rank_NOT_READY_proven']==0 and stage_replay['WCL_API_calls']==0
          membership_patch=json.load(open('/tmp/runtime-membership-patch-selftest.json'))
          membership_replay=json.load(open('/tmp/runtime-membership-replay-selftest.json'))
          assert membership_patch['status']=='PASS_SYNTHETIC_STATIC' and membership_patch['negative_controls_rejected']>=6
          assert membership_replay['status']=='PASS_SYNTHETIC_STATIC' and membership_replay['negative_controls_rejected']>=7
          assert membership_patch['added_original_ready_calls']==0 and membership_replay['physical_NOT_READY_claims']==0
          life_patch=json.load(open('/tmp/lifecycle-patcher-selftest.json'))
          life_replay=json.load(open('/tmp/lifecycle-replay-selftest.json'))
          assert life_patch['status']=='PASS_SYNTHETIC_STATIC' and life_patch['negative_controls']>=6
          assert life_replay['status']=='PASS_SYNTHETIC_STATIC' and life_replay['negative_controls']>=7
          assert life_patch['additional_original_create_init_ready_calls']==0
          assert life_replay['physical_READY_proven']==0 and life_replay['WCL_API_calls']==0
          print('GENERIC_ORIGINAL_SIMC_LIFECYCLE_SOURCE_NEUTRAL_SYNTHETIC_PASS')
          PY
  original-shaman-source-root:
    runs-on: ubuntu-latest
    needs: [generic-pre-source-contract]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: original-simc
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse already validated Shaman Native 4-target source-token baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 42744084203
          name: zrot-gr-original-shaman-native-marginal-3d92ad32576e91aaefd19df8d03c39a373c46632
          github-token: ${{ github.token }}
          path: /tmp/shaman-marginal-existing
      - name: Verify source pins and apply read-only source instrumentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-simc rev-parse HEAD)" = b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          echo '7b818a65fb4e9a812ddb2efb90406a2825ddd9abdd325067edeb3f37bd263339  /tmp/shaman-marginal-existing/zrot-gr-original-shaman-native-1-2-3-5-grid.json' | sha256sum -c -
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from general_rotation_original_select_extra_pre_v1 import valid_plan
          p=json.load(open('tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json'))
          valid_plan(p,Path('original-simc'))
          print('PINNED_SHAMAN_CLASS_AND_PROFILE_PRE_FIELD_SEMANTICS_PASS',len(p['fields']))
          PY
          python -B tools/research/simc_original_select_if_pre_witness_v1.py \
            --source-root original-simc \
            --plan tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json \
            --receipt /tmp/shaman-original-if-prepare.json
          python -B tools/research/general_rotation_same_run_return_emitter_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-original-if-prepare.json \
            --patch-receipt /tmp/shaman-return-emitter.json
          python -B tools/research/general_rotation_original_foreground_dispatch_v1.py \
            --simc-root original-simc \
            --prior-receipt /tmp/shaman-return-emitter.json \
            --patch-receipt /tmp/shaman-dispatch.json
          python -B tools/research/general_rotation_original_select_extra_pre_v1.py \
            --source-root original-simc \
            --plan tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
            --prior-receipt /tmp/shaman-dispatch.json \
            --out-receipt /tmp/shaman-extra-pre-patch.json
          python -B tools/research/general_rotation_original_candidate_stage_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-extra-pre-patch.json \
            --out-receipt /tmp/shaman-candidate-stage-patch.json
          python -B tools/research/general_rotation_original_runtime_membership_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-candidate-stage-patch.json \
            --out-receipt /tmp/shaman-runtime-membership-patch.json
          python -B tools/research/general_rotation_original_action_lifecycle_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-runtime-membership-patch.json \
            --out-receipt /tmp/shaman-action-lifecycle-patch.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/shaman-extra-pre-patch.json'))
          assert x['original_action_ready_cxx_call_added']==0
          assert x['original_queue_and_JSON2_methods_added']==0
          assert x['original_if_native_comparator_calls_added']==0
          assert x['claims_complete_physical_READY'] is False
          assert len(x['captured_fields'])==10
          assert x['native_ready_post_return_marker']=='ZROT_ORIGINAL_SELECT_NATIVE_READY_RESULT_V1|'
          assert x['original_action_ready_call_count_preserved'] is True
          z=json.load(open('/tmp/shaman-candidate-stage-patch.json'))
          assert z['schema']=='ZrotOriginalSimCNativeCandidateStagePatchV1'
          assert z['additional_action_ready_calls']==0 and z['additional_IF_RNG_or_queue_calls']==0
          assert z['runtime_candidate_stage_is_not_physical_READY'] is True
          member=json.load(open('/tmp/shaman-runtime-membership-patch.json'))
          assert member['schema']=='ZrotOriginalNativeSourceRowForegroundMembershipPatchV1'
          assert member['original_action_ready_calls_added']==0
          assert member['native_IF_RNG_queue_calls_added']==0
          assert member['physical_READY_proven']==0
          life=json.load(open('/tmp/shaman-action-lifecycle-patch.json'))
          assert life['schema']=='ZrotOriginalSimCActionCreateInitLifecycleProbeV1'
          assert life['zero_additional_original_create_init_calls'] is True
          assert life['added_native_ready_or_RNG_or_queue_or_IF_calls']==0
          assert life['physical_READY_proven']==0 and life['WCL_calls']==0
          print('SHAMAN_ORIGINAL_SOURCE_PASSIVE_PATCH_NO_READY_SIDE_EFFECT_PASS')
          PY
      - name: Build original pinned SimC CXX once for source-line and PRE root witness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --max-size=2G
          cmake -S original-simc -B /tmp/zrot-shaman-select-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_TESTING=OFF \
            -DSC_NO_NETWORKING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/zrot-shaman-select-native --target simc --parallel 3
          test -x /tmp/zrot-shaman-select-native/simc
      - name: Original Enhancement 1T and 3T exact SELECT PRE roots, preserve existing original action tokens
        shell: bash
        run: |
          set -euo pipefail
          for target in 1 3; do
            folder="/tmp/shaman-source-root/shaman_enhancement-${target}t"
            python -B tools/research/simc_native_reference_capture.py \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --spec enhancement \
              --simc-bin /tmp/zrot-shaman-select-native/simc \
              --targets "$target" --seed 31459 --fight-seconds 30 \
              --out-dir "$folder" --timeout 180
            python -B tools/research/general_rotation_original_select_extra_pre_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --plan tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
              --legacy-plan tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json \
              --source-label shaman_enhancement --targets "$target" \
              --out "$folder/selected-root-exact-pre-source-if.json"
            python -B tools/research/general_rotation_original_attempt_frontier_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior "$folder/selected-root-exact-pre-source-if.json" \
              --plan tools/research/fixtures/zrot_shaman_priority_frontier_v1.json \
              --adapter tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
              --targets "$target" \
              --out "$folder/original-native-attempt-frontier.json"
            python -B tools/research/general_rotation_original_candidate_stage_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior-frontier "$folder/original-native-attempt-frontier.json" \
              --out "$folder/original-native-candidate-stage.json"
            python -B tools/research/general_rotation_original_runtime_membership_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior-stage "$folder/original-native-candidate-stage.json" \
              --prior-frontier "$folder/original-native-attempt-frontier.json" \
              --out "$folder/original-apl-runtime-membership.json"
            python -B tools/research/general_rotation_original_action_lifecycle_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior-membership "$folder/original-apl-runtime-membership.json" \
              --out "$folder/original-action-lifecycle.json"
          done
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from simc_native_json_sequence import extract_json_sequence
          from general_rotation_simc_native_target_grid_v1 import examine
          from general_rotation_simc_e2e_research_engine_v1 import compile_spec
          old=json.loads(Path('/tmp/shaman-marginal-existing/zrot-gr-original-shaman-native-1-2-3-5-grid.json').read_bytes())
          assert old['new_actual_native_spec_key']=='shaman_enhancement'
          src=Path('original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc').read_bytes()
          meta=next(x for x in json.load(open('tools/research/fixtures/general_rotation_simc_pinned_three_class_v1.json'))['profiles'] if x['key']=='shaman_enhancement')
          program=compile_spec(src,meta,None)['conditioned_opener_and_priority']['all_ordered_source_IF_ELSE_lists']
          for target in (1,3):
              path=Path(f'/tmp/shaman-source-root/shaman_enhancement-{target}t')
              oldcase=next(x for x in old['native_target_cases'] if x['target_count']==target)
              current=examine(extract_json_sequence(path)['combat_sequence'],program,target)
              assert current['sample_actions']==oldcase['sample_actions'],target
              now=[(x['at_simc_ms'],x['action']) for x in current['first_10sec_sample_actions_NOT_opener_end']]
              prev=[(x['at_simc_ms'],x['action']) for x in oldcase['first_10sec_sample_actions_NOT_opener_end']]
              assert now==prev,(target,'ORIGINAL_NATIVE_SAMPLE_CHANGED')
              x=json.loads((path/'selected-root-exact-pre-source-if.json').read_bytes())
              frontier=json.loads((path/'original-native-attempt-frontier.json').read_bytes())
              stages=json.loads((path/'original-native-candidate-stage.json').read_bytes())
              membership=json.loads((path/'original-apl-runtime-membership.json').read_bytes())
              lifecycle=json.loads((path/'original-action-lifecycle.json').read_bytes())
              assert lifecycle['schema']=='ZrotOriginalSimCActionLifecycleSourceBoundReplayV1'
              assert lifecycle['source_spec']=='shaman_enhancement' and lifecycle['targets']==target
              assert lifecycle['selected_root']==membership['selected_root']
              assert lifecycle['original_source_to_runtime_membership_preserved'] is True
              assert lifecycle['same_actor_source_and_action_ptr_four_phase_join'] is True
              assert lifecycle['physical_skill_READY_independently_proven']==0
              assert lifecycle['current_Retail_priority']=='UNKNOWN'
              assert lifecycle['WCL_independent_blind_postlock']=='NOT_RUN'
              assert lifecycle['dummy_wrong_cast']=='UNKNOWN' and lifecycle['opener_end']=='UNKNOWN'
              if target==3:
                  gaps=lifecycle['unvisited_source_causal_guard_candidates']
                  assert len(gaps)==1 and gaps[0]['rank']==6 and gaps[0]['action']=='sundering'
                  print('AOE_SOURCE_RANK6_NATIVE_CREATION_ORIGIN',gaps[0])
              print('GENERIC_ORIGINAL_NATIVE_ACTION_LIFECYCLE',target,lifecycle['background_origin_counts'])
              assert membership['schema']=='ZrotOriginalNativeAPLSourceRuntimeMembershipReplayV1'
              assert membership['source_spec']=='shaman_enhancement' and membership['targets']==target
              assert membership['selected_root']==frontier['selected_root']
              assert membership['selected_root_original_foreground_membership']=='PRESENT'
              assert len(membership['same_root_upper_source_rows'])==frontier['selected_root']['source_rank']-1
              assert membership['original_signature_source_row_binding']=='EXACT_POINTER_MATCH'
              assert membership['source_rank_not_visited_is_NOT_READY'] is False
              assert membership['current_Retail_gameplay_ready']=='UNKNOWN'
              assert membership['General_Rotation_priority_promoted']==0
              if target==3:
                  r6=membership['same_root_upper_source_rows'][5]
                  assert r6['rank']==6 and r6['source_action']=='sundering'
                  assert r6['same_root_stage_visit']=='UNOBSERVED'
                  assert r6['original_action_ready_result']=='NOT_CALLED'
                  print('AOE_NATIVE_RANK6_RUNTIME_MEMBERSHIP',r6['runtime_membership_class'],r6['native_background_flag'],r6['native_sequence_flag'])
              print('GENERIC_NATIVE_APL_RUNTIME_MEMBERSHIP',target,membership['classification_counts'],membership['unvisited_source_row_membership_states'])
              assert stages['schema']=='ZrotOriginalSimCNativeCandidateStageSameRootReplayV1'
              assert stages['source_spec']=='shaman_enhancement' and stages['targets']==target
              assert stages['every_attempt_has_exact_stage_pre_return'] is True
              assert stages['same_root_action_ready_attempts']==frontier['preceding_attempt_count']+1
              assert len(stages['source_rank_coverage'])==frontier['selected_root']['source_rank']-1
              assert all(x['physical_mechanic_ready']=='UNKNOWN' for x in stages['source_rank_coverage'])
              assert stages['unknown_source_rank_is_not_NOT_READY'] is True
              assert stages['native_post_not_independent_physical_ready'] is True
              assert stages['current_Retail_priority']=='UNKNOWN' and stages['dummy_wrong_cast']=='UNKNOWN'
              if target==3:
                  six=stages['source_rank_coverage'][5]
                  assert six['rank']==6 and six['source_action']=='sundering'
                  print('SHAMAN_AOE_RANK6_NATIVE_STAGE',six['native_visit_state'],six['original_action_ready_result'])
              print('GENERIC_ORIGINAL_NATIVE_CANDIDATE_STAGE',target,stages['native_candidate_stage_count'],stages['source_rank_visit_counts'])
              assert frontier['schema']=='ZrotOriginalNativeSameForegroundRootAttemptFrontierV1'
              assert frontier['source_spec']=='shaman_enhancement' and frontier['targets']==target
              assert frontier['selected_root']['t_ms']==(942 if target==1 else 940)
              assert frontier['selected_root']['source_rank']==(4 if target==1 else 20)
              assert frontier['selected_root']['native_action_ready_return'] is True
              assert frontier['original_foreground_CALL_entry']['original_action_ready_return'] is True
              assert frontier['preceding_noncontrol_NATIVE_TRUE']==0
              assert frontier['physical_ability_ready_independent_of_Native_result']=='UNKNOWN'
              assert frontier['WoW_current_Retail_priority']=='UNKNOWN'
              assert frontier['WCL_blind_holdout']=='NOT_RUN' and frontier['dummy_wrong_cast']=='UNKNOWN'
              print('SHAMAN_ORIGINAL_NATIVE_ATTEMPT_FRONTIER',target,frontier['preceding_attempt_count'],frontier['higher_source_ranks_not_attempted'])
              assert x['source_spec']=='shaman_enhancement' and x['targets']==target
              assert x['original_selected_direct_foreground']>0
              assert x['source_if_comparator_not_replay_input'] is True
              assert x['full_physical_READY_proven']==0 and x['competitor_ready_proven']==0
              assert x['opener_end']=='UNKNOWN' and x['dummy_wrong_cast']=='UNKNOWN'
              first=[r for r in x['selected_source_IF_samples'] if r['t_ms']<10000]
              assert first,(target,'NO_ORIGINAL_SOURCE_ROOT_CANDIDATES')
              assert all(r['original_PRE_fields'].get('active_enemies')==target for r in first)
              assert all(r['source_list'] in program for r in first)
              assert any(r['source_list'] in ('single_sb','single_totemic','aoe') for r in first)
              print('ACTUAL_PINNED_SHAMAN_EXACT_ROOT_SELECTED_PRE',target,
                    'direct',x['original_selected_direct_foreground'],
                    'first10',len(first),'IF_TRIAGE',x['source_independent_IF_triage'],
                    'EXAMPLES',[(r['t_ms'],r['source_list'],r['source_rank'],r['source_action'],
                                 r['original_source_IF_independent_truth']) for r in first[:10]])
          print('ORIGINAL_SHAMAN_ST_AOE_SAME_RUN_SOURCE_ROW_AND_PRE_PARITY_PASS')
          PY
          sha256sum /tmp/shaman-source-root/shaman_enhancement-1t/selected-root-exact-pre-source-if.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-3t/selected-root-exact-pre-source-if.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-1t/original-native-attempt-frontier.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-3t/original-native-attempt-frontier.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-1t/original-native-candidate-stage.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-3t/original-native-candidate-stage.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-1t/original-apl-runtime-membership.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-3t/original-apl-runtime-membership.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-1t/original-action-lifecycle.json
          sha256sum /tmp/shaman-source-root/shaman_enhancement-3t/original-action-lifecycle.json
      - name: Preserve compact original source proof only; raw logs remain ephemeral
        if: always()
        uses: actions/upload-artifact@v4
