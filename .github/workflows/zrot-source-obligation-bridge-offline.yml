name: zrot-source-obligation-bridge-offline
on:
  push:
    branches:
      - work/source-obligation-bridge-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify project research sources compile
        run: |
          python -m py_compile tools/research/simc_apl_readiness_provider.py tools/research/zrot_source_obligation_gate_v1.py tools/research/zrot_source_obligation_readiness_bridge_v1.py
      - name: Existing SimC readiness provider synthetic baseline
        run: python -B tools/research/simc_apl_readiness_provider.py
      - name: Shadow obligation gate regression
        run: python -B tools/research/zrot_source_obligation_gate_v1.py --self-test
      - name: Actual provider-to-gate interface regression
        run: python -B tools/research/zrot_source_obligation_readiness_bridge_v1.py --self-test
