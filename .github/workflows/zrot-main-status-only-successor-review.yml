name: zrot-main-status-only-successor-review

on:
  push:
    branches:
      - work/main-status-only-successor-20261102
    paths:
      - .github/workflows/zrot-main-status-only-successor-review.yml
      - active/branches/BR-MAIN-STATUS-ONLY-20261102/MAIN_AUTHORITY_STATUS_ONLY_CANDIDATE_V1.json
      - tools/recovery/main_status_only_successor_review_v1.py
      - docs/MAIN_124_FEX_STATIC_INTERFACE_COMPATIBILITY_20261102.json
      - tools/recovery/main_124_fex_source_interface_gate_v1.py
      - tools/recovery/zrot_research_strict_pre_offline_behavior_v1.py
      - docs/MAIN_124_OFFLINE_BEHAVIOR_AND_PRESTATE_ZERO_STACK_FINDING_20261102.json
      - active/branches/BR-PRESTATE-ZERO-STACK-20261102/PRESTATE_REMOVE_STACK_ZERO_FIX_V1.patch

permissions:
  contents: read

jobs:
  fail-closed-review:
    name: Status-only authority Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Confirm main remains README-only bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "4790f77f76a75f26ff0558d1d18c16cd9d630c4b"
          test "$(git ls-tree -r --name-only FETCH_HEAD)" = "README.md"
      - name: Compile and test status-only successor review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/status_only
          python -B -m py_compile tools/recovery/main_status_only_successor_review_v1.py
          python -B tools/recovery/main_status_only_successor_review_v1.py --status > ci_artifacts/status_only/status.json
          python -B tools/recovery/main_status_only_successor_review_v1.py --self-test > ci_artifacts/status_only/self_test.json
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          a=Path("ci_artifacts/status_only")
          status=json.loads((a/"status.json").read_text())
          test=json.loads((a/"self_test.json").read_text())
          assert status["result"]=="PASS_STATUS_ONLY_PROPOSAL__NO_MAIN_PROMOTION"
          assert status["selected_workflow_id"] is None
          assert status["runtime_or_inbox_executed"] is False
          assert status["product_MAIN_promoted"] is False
          assert status["latest_authoritative_runtime"]=="UNKNOWN"
          assert status["latest_authoritative_work_state"]=="UNKNOWN"
          assert test["self_test"]["status"]=="PASS"
          assert test["self_test"]["negative_regressions"]==15
          assert test["self_test"]["source_code_execution"] is False
          assert test["Seq578"]=="FAILED_QUARANTINED_PRESERVED"
          assert test["Seq637"]=="UNKNOWN"
          output={
             "schema":"ZrotMainStatusOnlySuccessorGithubCIReceiptV1",
             "result":"PASS_BRANCH_STATUS_ONLY__ACTIVE_MAIN_UNRESOLVED",
             "github_sha":os.environ["GITHUB_SHA"],
             "run_id":os.environ["GITHUB_RUN_ID"],
             "python":platform.python_version(),
             "negative_regression_cases":test["self_test"]["negative_regressions"],
             "historical_alternatives":status["verified_historical_alternatives"],
             "selected_workflow":None,
             "workflow_executed":False,
             "inbox_dispatched":False,
             "approved_runtime_found":False,
             "main_product_promotion":False,
             "frozen_mutation":False,
             "seq578":"FAILED_QUARANTINED_PRESERVED",
             "seq637":"UNKNOWN"
          }
          (a/"ci_receipt.json").write_text(json.dumps(output,indent=2,sort_keys=True)+"\n")
          print("ZROT_STATUS_ONLY_SUCCESSOR_REVIEW=PASS_NO_MAIN_PROMOTION")
          PY
      - name: Independent direct JSON audit of no-execution authority (not validator replay)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("active/branches/BR-MAIN-STATUS-ONLY-20261102/MAIN_AUTHORITY_STATUS_ONLY_CANDIDATE_V1.json").read_bytes())
          b=json.loads(Path("docs/MAIN_SIX_LIVE_HASHES_SNAPSHOT_CONSISTENCY_20261102.json").read_bytes())
          w=c["workflow_authority"]
          assert w["selected_workflow_id"] is None and w["preferred_workflow_id"] is None
          assert w["selection_state"]=="UNRESOLVED_NEEDS_MAIN_APPROVED_EVIDENCE"
          assert w["current_approved_runtime"]=="UNKNOWN" and w["current_approved_work_state"]=="UNKNOWN"
          assert {x["id"] for x in w["candidates"]}=={
              "FEX_FULL_ENGINE_SYNTHETIC_PROBE_V1","FIRST_CROSS_SPEC_SYNTHETIC_PROBE_V1"}
          assert len(b["verified_user_pc_files"])==6
          assert b["verdict"]["current_MAIN_authority"]=="UNKNOWN"
          assert len(b["verified_historical_internal_disagreements"])==6
          a=c["status_adapter_contract"]
          assert a["only_command"]=="STATUS_ONLY"
          assert a["default_operation"]=="READ_CANDIDATE_STATUS"
          assert set(a["allowed_operations"])=={
              "READ_CANDIDATE_STATUS","VALIDATE_CANDIDATE_CONTRACT"}
          assert "RUN_ACTIVE" in a["forbidden_operations"]
          assert "DISPATCH_INBOX" in a["forbidden_operations"]
          assert a["execution_backend"]=="NONE_NO_DISPATCHER_NO_SUBPROCESS_NO_IMPORT_LEGACY_MODULES"
          assert c["promotion_gates"]["total_authorized_for_live_activation"] is False
          assert all(value is False for value in c["promotion_gates"].values())
          assert c["invariants"]["FROZEN_changed"] is False
          assert c["invariants"]["Seq578"]=="FAILED_QUARANTINED_PRESERVED"
          assert c["invariants"]["Seq637"]=="UNKNOWN"
          assert c["verdict"]=="REVIEW_ONLY_STATUS_SAFE__ACTIVE_AUTHORITY_NOT_SELECTED"
          print("INDEPENDENT_RAW_JSON_STATUS_ONLY=PASS")
          PY
      - name: Refuse any execution flags in isolated status checker
        shell: bash
        run: |
          set -euo pipefail
          if python -B tools/recovery/main_status_only_successor_review_v1.py --execute > /dev/null 2>&1; then
            echo "DANGEROUS_EXECUTION_FLAG_ACCEPTED"
            exit 1
          fi
          echo "UNKNOWN_EXECUTION_FLAG_REJECTED=PASS"
      - name: Focused historical FEX interface and source argument compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile tools/recovery/main_124_fex_source_interface_gate_v1.py
          python -B tools/recovery/main_124_fex_source_interface_gate_v1.py --self-test > ci_artifacts/status_only/fex_static_interface.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("ci_artifacts/status_only/fex_static_interface.json").read_text())
          assert obj["result"]=="PASS_AST_AND_HISTORICAL_PIN_COMPATIBILITY_ONLY"
          assert obj["archive_source_ast_replay_here"] is False
          assert obj["historical_import_edges"]==43
          assert obj["historical_import_symbol_export_checks"]==29
          assert obj["fex_exact_bound_sources"]==10
          assert obj["fex_synthetic_behavior_cases"]==2
          assert obj["fex_declared_capabilities"]==11
          assert obj["fex_complete_behavior_evidence"] is False
          assert obj["self_test"]["result"]=="PASS"
          assert obj["self_test"]["contract_negative_cases"]==10
          assert obj["self_test"]["ast_public_source_positive_cases"]==3
          assert all(x["AST_signature_accepts_historical_call_form"] is True for x in obj["research_actual_source_pins_and_AST_signatures"])
          assert obj["product_runtime_execution"] is False and obj["product_MAIN_promotion"] is False
          print("HISTORICAL_FEX_AST_COMPAT=PASS_PARTIAL_BEHAVIORAL_CLAIM")
          PY
      - name: Execute research Strict PRE/coverage synthetic edge fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile tools/recovery/zrot_research_strict_pre_offline_behavior_v1.py
          python -B tools/recovery/zrot_research_strict_pre_offline_behavior_v1.py --original-defect-repro > ci_artifacts/status_only/research_original_bug.json
          python -B tools/recovery/zrot_research_strict_pre_offline_behavior_v1.py --candidate-patch --self-test > ci_artifacts/status_only/research_pre_behavior.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ci_artifacts/status_only/research_pre_behavior.json")
          d=json.loads(p.read_text())
          original=json.loads(Path("ci_artifacts/status_only/research_original_bug.json").read_text())
          assert original["result"]=="KNOWN_LEGACY_DEFECT_REPRODUCED"
          assert original["original_next_timestamp_state"]==[True,1]
          assert original["expected_next_timestamp_state"]==[False,0]
          assert original["original_code_modified"] is False
          assert d["result"]=="PASS"
          assert d["mode"]=="BRANCH_ONLY_IN_MEMORY_ZERO_STACK_CANDIDATE"
          assert d["candidate_only_in_memory"] is True and d["original_research_source_modified"] is False
          assert d["research_module_original_sha_exact_n"]==3
          assert d["behavioral_assertion_count"]>=30
          assert d["strict_PRE_bisect_left_timestamp_less_than_t"]=="PASS"
          assert d["same_timestamp_future_state_leakage"] is False
          assert d["coverage_label_treated_as_evidence_strength"] is False
          assert d["state_readiness_missing_assumed_available"] is False
          assert d["original_private_124_source_executed"] is False
          assert d["product_MAIN_entrypoint_executed"] is False
          assert d["current_product_authority"]=="UNKNOWN"
          assert d["seq578"]=="FAILED_QUARANTINED_PRESERVED"
          assert d["seq637"]=="UNKNOWN"
          print("RESEARCH_STRICT_PRE_OFFLINE_BEHAVIOR=PASS")
          PY
      - name: Independently check branch-local minimal patch and external private receipt limits
        shell: bash
        run: |
          set -euo pipefail
          patch="active/branches/BR-PRESTATE-ZERO-STACK-20261102/PRESTATE_REMOVE_STACK_ZERO_FIX_V1.patch"
          git apply --check "$patch"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/MAIN_124_OFFLINE_BEHAVIOR_AND_PRESTATE_ZERO_STACK_FINDING_20261102.json").read_text())
          r=json.loads(Path("ci_artifacts/status_only/research_pre_behavior.json").read_text())
          o=json.loads(Path("ci_artifacts/status_only/research_original_bug.json").read_text())
          assert d["private_historical_runtime"]["synthetic_behavioral_assertions"]==42
          assert d["private_historical_runtime"]["actual_private_source_in_public_GitHub"] is False
          assert d["private_historical_runtime"]["strict_PRE_included_in_private_42"] is False
          assert d["strict_pre"]["prior_failing_original_ci_id"]==41398991492
          assert d["strict_pre"]["original_result"]=="FAIL_CONFIRMED_LEGACY_ZERO_STACK_DEFECT"
          assert d["strict_pre"]["candidate_applied_to_PRODUCT_MAIN"] is False
          assert d["strict_pre"]["candidate_applied_to_public_original"] is False
          assert d["strict_pre"]["candidate_behavior_assertions"]==r["behavioral_assertion_count"]
          assert d["strict_pre"]["historical_state_at_t_111"]==o["original_next_timestamp_state"]
          assert d["strict_pre"]["corrected_expected_state_at_t_111"]==o["expected_next_timestamp_state"]
          assert d["strict_pre"]["original_missing_stack_semantics"]=="RETURNS_ACTIVE_STACK_1__OBSERVABILITY_UNCERTAINTY_NOT_CLOSED"
          assert d["authority"]["Seq578"]=="FAILED_QUARANTINED_PRESERVED"
          assert d["authority"]["Seq637"]=="UNKNOWN"
          assert d["authority"]["shared_MAIN_source_modified"] is False
          assert d["authority"]["shared_GENERAL_ROTATION_modified"] is False
          print("ZERO_STACK_REVIEW_PATCH_DRY_RUN_AND_EVIDENCE_LIMITS=PASS")
          PY
      - name: Save sanitized review receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-only-review-${{ matrix.python-version }}-${{ github.sha }}
          path: ci_artifacts/status_only/
          if-no-files-found: warn
          retention-days: 7
