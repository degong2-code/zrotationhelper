name: zrot-gr-original-native-ready-branch-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/research/general_rotation_original_ready_branch_probe_v1.py
      - tools/research/general_rotation_original_ready_branch_replay_v1.py
      - tools/research/fixtures/zrot_shaman_original_ready_branch_focus_v1.json
      - .github/workflows/zrot-gr-original-native-ready-branch-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generic-branch-contract:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile generic patcher and replayer, reject synthetic bad branches
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/research/general_rotation_original_ready_branch_probe_v1.py \
            tools/research/general_rotation_original_ready_branch_replay_v1.py
          python -B tools/research/general_rotation_original_ready_branch_probe_v1.py >/tmp/generic-branch-probe-selftest.json
          python -B tools/research/general_rotation_original_ready_branch_replay_v1.py >/tmp/generic-branch-replay-selftest.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/generic-branch-probe-selftest.json'))
          b=json.load(open('/tmp/generic-branch-replay-selftest.json'))
          assert a['status']==b['status']=='PASS_SYNTHETIC_STATIC'
          assert a['negative_controls']>=6 and b['negative_controls']>=5
          assert a['source_branch_markers']==9 and a['new_original_action_ready_calls']==0
          assert b['missing_marker_infers_NOT_READY'] is False
          assert a['new_native_IF_RNG_calls']==0 and b['no_SimC_or_WCL_calls']
          print('GENERIC_ORIGINAL_ACTION_READY_CAUSAL_TRACE_CONTRACT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrot-gr-branch-contract-${{ matrix.python }}-${{ github.sha }}
          path: |
            /tmp/generic-branch-probe-selftest.json
            /tmp/generic-branch-replay-selftest.json
          retention-days: 14
          if-no-files-found: warn

  original-shaman-native-branch:
    needs: [generic-branch-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          path: original-simc
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42744084203
          name: zrot-gr-original-shaman-native-marginal-3d92ad32576e91aaefd19df8d03c39a373c46632
          github-token: ${{ github.token }}
          path: /tmp/shaman-marginal-existing
      - name: Verify immutable source and baseline, apply existing proven player patch chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-simc rev-parse HEAD)" = b522cded8c26b97dac03fdf56e57a03ec7e8faa6
          echo '7b818a65fb4e9a812ddb2efb90406a2825ddd9abdd325067edeb3f37bd263339  /tmp/shaman-marginal-existing/zrot-gr-original-shaman-native-1-2-3-5-grid.json' | sha256sum -c -
          python -B tools/research/simc_original_select_if_pre_witness_v1.py \
            --source-root original-simc \
            --plan tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json \
            --receipt /tmp/shaman-original-if-prepare.json
          python -B tools/research/general_rotation_same_run_return_emitter_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-original-if-prepare.json \
            --patch-receipt /tmp/shaman-return-emitter.json
          python -B tools/research/general_rotation_original_foreground_dispatch_v1.py \
            --simc-root original-simc \
            --prior-receipt /tmp/shaman-return-emitter.json \
            --patch-receipt /tmp/shaman-dispatch.json
          python -B tools/research/general_rotation_original_select_extra_pre_v1.py \
            --source-root original-simc \
            --plan tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
            --prior-receipt /tmp/shaman-dispatch.json \
            --out-receipt /tmp/shaman-extra-pre-patch.json
          python -B tools/research/general_rotation_original_candidate_stage_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-extra-pre-patch.json \
            --out-receipt /tmp/shaman-candidate-stage-patch.json
          python -B tools/research/general_rotation_original_runtime_membership_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-candidate-stage-patch.json \
            --out-receipt /tmp/shaman-runtime-membership-patch.json
          python -B tools/research/general_rotation_original_action_lifecycle_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-runtime-membership-patch.json \
            --out-receipt /tmp/shaman-action-lifecycle-patch.json
          python -B tools/research/general_rotation_original_ready_branch_probe_v1.py \
            --source-root original-simc \
            --prior-receipt /tmp/shaman-original-if-prepare.json \
            --out-receipt /tmp/shaman-original-action-ready-branch-patch.json
          python - <<'PY'
          import json
          patch=json.load(open('/tmp/shaman-original-action-ready-branch-patch.json'))
          assert patch['schema']=='ZrotOriginalActionReadyBranchPassivePatchV1'
          assert patch['original_calls_added']=={
            'action_ready':0,'ready':0,'IF':0,'RNG':0,'cooldown':0,'queue':0}
          assert patch['branch_markers_per_source']==9
          assert patch['readiness_proof']=='IN_ORIGINAL_NATIVE_CALL_ONLY_NOT_INDEPENDENT_WOW_PRE'
          print('ORIGINAL_PINNED_ACTION_CPP_PASSIVE_BRANCH_INSTRUMENTATION_PASS')
          PY
      - name: Compile original SimC with passive branch log (no new readiness call)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --max-size=2G
          cmake -S original-simc -B /tmp/zrot-original-branch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_TESTING=OFF \
            -DSC_NO_NETWORKING=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/zrot-original-branch --target simc --parallel 3
          test -x /tmp/zrot-original-branch/simc
      - name: Replay exact original ST and AoE action tokens, then inspect AoE rank19 Native cause
        shell: bash
        run: |
          set -euo pipefail
          for target in 1 3; do
            folder="/tmp/zrot-ready-branch/shaman_enhancement-${target}t"
            python -B tools/research/simc_native_reference_capture.py \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --spec enhancement \
              --simc-bin /tmp/zrot-original-branch/simc \
              --targets "$target" --seed 31459 --fight-seconds 30 \
              --out-dir "$folder" --timeout 180
            python -B tools/research/general_rotation_original_select_extra_pre_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --plan tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
              --legacy-plan tools/research/fixtures/zrot_shaman_original_source_if_pre_adapter_v1.json \
              --source-label shaman_enhancement --targets "$target" \
              --out "$folder/selected-root-exact-pre-source-if.json"
            python -B tools/research/general_rotation_original_attempt_frontier_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior "$folder/selected-root-exact-pre-source-if.json" \
              --plan tools/research/fixtures/zrot_shaman_priority_frontier_v1.json \
              --adapter tools/research/fixtures/zrot_shaman_original_select_extra_pre_v1.json \
              --targets "$target" \
              --out "$folder/original-native-attempt-frontier.json"
            python -B tools/research/general_rotation_original_candidate_stage_replay_v1.py \
              --native-log "$folder/simc_native_log.txt" \
              --profile original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc \
              --prior-frontier "$folder/original-native-attempt-frontier.json" \
              --out "$folder/original-native-candidate-stage.json"
          done
          python -B tools/research/general_rotation_original_ready_branch_replay_v1.py \
            --native-log /tmp/zrot-ready-branch/shaman_enhancement-3t/simc_native_log.txt \
            --prior-frontier /tmp/zrot-ready-branch/shaman_enhancement-3t/original-native-attempt-frontier.json \
            --prior-stage /tmp/zrot-ready-branch/shaman_enhancement-3t/original-native-candidate-stage.json \
            --plan tools/research/fixtures/zrot_shaman_original_ready_branch_focus_v1.json \
            --out /tmp/zrot-original-native-ready-branch.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools/research')
          from simc_native_json_sequence import extract_json_sequence
          from general_rotation_simc_native_target_grid_v1 import examine
          from general_rotation_simc_e2e_research_engine_v1 import compile_spec
          old=json.loads(Path('/tmp/shaman-marginal-existing/zrot-gr-original-shaman-native-1-2-3-5-grid.json').read_bytes())
          src=Path('original-simc/profiles/MID2/MID2_Shaman_Enhancement.simc').read_bytes()
          meta=next(x for x in json.load(open('tools/research/fixtures/general_rotation_simc_pinned_three_class_v1.json'))['profiles'] if x['key']=='shaman_enhancement')
          program=compile_spec(src,meta,None)['conditioned_opener_and_priority']['all_ordered_source_IF_ELSE_lists']
          for target in (1,3):
              path=Path(f'/tmp/zrot-ready-branch/shaman_enhancement-{target}t')
              prev=next(x for x in old['native_target_cases'] if x['target_count']==target)
              now=examine(extract_json_sequence(path)['combat_sequence'],program,target)
              assert now['sample_actions']==prev['sample_actions'],target
              before=[(x['at_simc_ms'],x['action']) for x in prev['first_10sec_sample_actions_NOT_opener_end']]
              after=[(x['at_simc_ms'],x['action']) for x in now['first_10sec_sample_actions_NOT_opener_end']]
              assert before==after,(target,'ORIGINAL_NATIVE_ACTION_TIME_CHANGED_BY_PASSIVE_LOG')
              front=json.load(open(path/'original-native-attempt-frontier.json'))
              assert front['selected_root']['source_rank']==(4 if target==1 else 20)
              assert front['selected_root']['t_ms']==(942 if target==1 else 940)
              print('PASSIVE_NATIVE_TRACE_ORIGINAL_ACTION_TOKENS_AND_TIMES_PARITY',target,len(after))
          branch=json.load(open('/tmp/zrot-original-native-ready-branch.json'))
          assert branch['schema']=='ZrotOriginalNativeSameCallBranchOutcomeReplayV1'
          assert len(branch['focused_original_native_calls'])==1
          f=branch['focused_original_native_calls'][0]
          assert (f['source_rank'],f['source_action'],f['original_NATIVE_action_ready_result'])==(19,'voltaic_blaze','FALSE')
          assert branch['physical_Retail_mechanic_READY']==branch['current_Retail_optimal_priority']=='UNKNOWN'
          assert branch['General_Rotation_priority_rules_promoted']==0 and not branch['MAIN_promoted']
          print('ORIGINAL_NATIVE_SAME_CALL_BRANCH_CAUSAL_PROOF',f)
          PY
          sha256sum /tmp/zrot-original-native-ready-branch.json \
            /tmp/shaman-original-action-ready-branch-patch.json
      - name: Preserve compact cause and parity witness, not full raw SimC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrot-gr-original-branch-cause-${{ github.sha }}
          path: |
            /tmp/zrot-original-native-ready-branch.json
            /tmp/shaman-original-action-ready-branch-patch.json
            /tmp/zrot-ready-branch/shaman_enhancement-1t/original-native-attempt-frontier.json
            /tmp/zrot-ready-branch/shaman_enhancement-3t/original-native-attempt-frontier.json
            /tmp/zrot-ready-branch/shaman_enhancement-3t/original-native-candidate-stage.json
          retention-days: 14
          if-no-files-found: warn
