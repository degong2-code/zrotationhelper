name: zrot-st2t-research-scope-survival

on:
  push:
    branches:
      - work/gr-simc-st-2t-wcl-blind-20261102
    paths:
      - _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/LATEST_HANDOFF.json
      - .github/workflows/zrot-st2t-research-scope-survival.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify full official scope and 5 future successor handoffs
        run: |
          set -euo pipefail
          python -m py_compile tools/governance/validate_scope_continuity_v1.py
          python -B tools/governance/validate_scope_continuity_v1.py \
            --validate --self-test \
            --handoff _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/LATEST_HANDOFF.json \
            > scope_receipt.json
          python - <<'PY'
          import json
          x=json.load(open("scope_receipt.json"))
          assert x["result"]=="PASS_SCOPE_CONTINUITY"
          assert x["negative_cases_passed"]==14
          assert len(x["five_hop_simulation"]["simulated_successor_hops"])==5
          assert x["old_raid_NSRT_encounter_output_required"] is False
          print("PRODUCT_SCOPE_ST2T_WCL_LANE_SURVIVAL=PASS")
          PY
