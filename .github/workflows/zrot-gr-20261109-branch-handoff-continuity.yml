name: ZRot General Rotation Branch Handoff Continuity (Gen6/Gen7)
on:
  push:
    branches:
      - work/gr-simc-st-2t-wcl-blind-20261102
    paths:
      - _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/LATEST_HANDOFF.json
      - _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/archive/LATEST_HANDOFF_SCOPEGEN6_BEFORE_20261110.json
      - .github/workflows/zrot-gr-20261109-branch-handoff-continuity.yml
      - README.md
      - docs/RESEARCH_INDEX.md
      - docs/CURRENT_RESEARCH_STATUS.md
      - docs/FEATURE_HISTORY_INDEX.md
      - docs/EVIDENCE_NAVIGATION_INDEX.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-archive-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate actual branch handoff and fixed policy five-hop simulation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/governance/validate_scope_continuity_v1.py
          python -B tools/governance/validate_scope_continuity_v1.py \
            --validate --self-test \
            --handoff _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/LATEST_HANDOFF.json \
            > /tmp/branch-scope-validation.json
          python - <<'PY'
          import hashlib,json,re,urllib.parse
          from pathlib import Path

          sha=lambda b: hashlib.sha256(b).hexdigest()
          root=Path.cwd()
          home=Path('_UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102')
          latest=json.loads((home/'LATEST_HANDOFF.json').read_bytes())
          policy_raw=Path('docs/PRODUCT_SCOPE_LOCK_V1.json').read_bytes()
          policy=json.loads(policy_raw)
          gen5_raw=(home/'archive/LATEST_HANDOFF_SCOPEGEN5_BEFORE_20261109.json').read_bytes()
          gen5=json.loads(gen5_raw)
          result=json.loads(Path('/tmp/branch-scope-validation.json').read_bytes())

          assert result['result']=='PASS_SCOPE_CONTINUITY'
          assert result['negative_cases_passed']==14
          assert len(result['five_hop_simulation']['simulated_successor_hops'])==5
          assert result['five_hop_simulation']['actual_handoffs_created']==0
          assert sha(policy_raw)=='157daa151bc60b0d059aab4fbb8b0d7f5fb4a8e9e42811e401edffecfc1df295'
          assert sha(gen5_raw)=='ab04457130b37bce8c55e359e60c77a75d9abcfd5f8806da952d8fc070742bd5'
          assert latest['scope_continuity']['policy_snapshot']==policy
          assert latest['scope_continuity']['generation'] in (6,7)
          assert latest['MAIN_promoted'] is False
          assert latest['shared_authoritative_state_mutated'] is False
          assert latest['FROZEN_modified'] is False
          assert latest['project_wide_FROZEN_changed'] is False
          assert latest['Seq578']=='FAILED_QUARANTINED'
          assert latest['Seq637']=='UNKNOWN'

          gen=latest['scope_continuity']['generation']
          if gen==6:
              assert latest['scope_continuity']['parent_handoff_sha256']==sha(gen5_raw)
              assert latest['previous_handoff_generation']==5
              assert result['active_real_generation']==6
          else:
              gen6_raw=(home/'archive/LATEST_HANDOFF_SCOPEGEN6_BEFORE_20261110.json').read_bytes()
              gen6=json.loads(gen6_raw)
              assert gen6['scope_continuity']['generation']==6
              assert gen6['scope_continuity']['parent_handoff_sha256']==sha(gen5_raw)
              assert latest['scope_continuity']['parent_handoff_sha256']==sha(gen6_raw)
              assert latest['previous_handoff_generation']==6
              assert latest['previous_handoff_byte_sha256']==sha(gen6_raw)
              assert latest['scope_continuity']['policy_snapshot']==gen6['scope_continuity']['policy_snapshot']
              assert latest['new_chat_prompt'].endswith('NEW_CHAT_START_PROMPT_SCOPEGEN7_20261110.md')
              assert latest['current_research_navigation'][
                  'readme_index']=='docs/RESEARCH_INDEX.md'
              assert result['active_real_generation']==7

          checks=[
              Path('README.md'),
              Path('docs/RESEARCH_INDEX.md'),
              Path('docs/FEATURE_HISTORY_INDEX.md'),
              Path('docs/EVIDENCE_NAVIGATION_INDEX.md'),
              Path('docs/CURRENT_RESEARCH_STATUS.md'),
          ]
          count=0
          for doc in checks:
              body=doc.read_text(encoding='utf-8')
              for raw in re.findall(r'\]\(([^)]+)\)',body):
                  uri=raw.strip().split('#',1)[0]
                  if not uri or uri.startswith(('https://','http://','mailto:')):
                      continue
                  linked=urllib.parse.unquote(uri)
                  resolved=(doc.parent/linked).resolve()
                  assert resolved.is_relative_to(root),(doc,linked,'PATH_ESCAPE')
                  assert resolved.exists(),(doc,linked,'BROKEN_RELATIVE_LINK')
                  count+=1
          print('BRANCH_SCOPE_PARENT_CHAIN_PASS',gen,'NAV_LINKS_PASS',count)
          PY
      - name: Source receipts and navigation files, never modify historic evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum README.md docs/RESEARCH_INDEX.md docs/FEATURE_HISTORY_INDEX.md \
            docs/EVIDENCE_NAVIGATION_INDEX.md docs/CURRENT_RESEARCH_STATUS.md \
            _UPLOAD_TO_CHATGPT/branches/BR-GR-ST2T-WCL-BLIND-20261102/LATEST_HANDOFF.json
