name: zrot-gr-actor-combatantinfo-pre-v1
on:
  push:
    branches: [work/gr-simc-st-2t-wcl-blind-20261102]
    paths:
      - tools/engine_first/wcl_actor_combatantinfo_pre_v1.py
      - .github/workflows/zrot-gr-actor-combatantinfo-pre-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify strict PRE and tamper/duplicate/other-actor guards
        run: |
          set -euo pipefail
          python -m py_compile tools/engine_first/wcl_actor_combatantinfo_pre_v1.py
          python -B tools/engine_first/wcl_actor_combatantinfo_pre_v1.py > /tmp/actor-ci-selftest.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/actor-ci-selftest.json'))
          assert x['status']=='PASS_OFFLINE_SYNTHETIC' and x['checks']==7
          assert x['independent_gameplay_PRIORITY_proven'] is False
          assert x['WCL_API_called'] is False
          print('ACTOR_COMBATANTINFO_STRICT_PRE_SYNTHETIC_PASS',x['checks'])
          PY
          sha256sum tools/engine_first/wcl_actor_combatantinfo_pre_v1.py

  previously-captured-wcl:
    runs-on: ubuntu-latest
    needs: [synthetic]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing distinct third WCL report raw capture (no new WCL call)
        uses: actions/download-artifact@v4
        with:
          run-id: 42599352437
          name: zrot-gr-live-wcl-coldstart-raw-56c016ab41b2b161fa79675194f26ab7df3c6d1d
          path: /tmp/wcl-actor-existing
          github-token: ${{ github.token }}
      - name: Exact actor and ledger verification then numeric-only build evidence
        run: |
          set -euo pipefail
          RAW_ROOT=$(find /tmp/wcl-actor-existing/raw -name checkpoint.json -print -quit)
          test -n "$RAW_ROOT"
          RAW_ROOT=$(dirname "$RAW_ROOT")
          python -B tools/engine_first/wcl_actor_combatantinfo_pre_v1.py \
            --raw-root "$RAW_ROOT" \
            --actor-gate /tmp/wcl-actor-existing/derived/identity.json \
            --out /tmp/actor-numeric-build-evidence.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/actor-numeric-build-evidence.json'))
          assert x['combatantinfo_pre_status']=='OBSERVED_STRICT_PRE'
          b=x['actor_numeric_build_snapshot']
          assert b['combatantinfo_at_ms']==1
          assert b['strictly_before_first_actor_action'] is True
          assert b['observed_numeric_specID']==72
          assert b['observed_gear_slot_count']==18
          assert b['observed_gear_item_count']==17
          assert b['observed_gear_empty_slot_count']==1
          assert b['observed_talent_entry_count']==76
          assert b['observed_gear_setID_item_counts'].get('2067')==4
          assert b['observed_gear_setID_item_counts'].get('2070')==2
          assert x['source_SimC_profile_build_equivalence']=='UNKNOWN'
          assert x['equipped_set_bonus_activated']=='UNKNOWN'
          assert x['current_Retail_patch_or_client_build']=='UNKNOWN'
          assert x['competing_action_READY']=='UNKNOWN'
          assert x['general_rotation_rule_certified'] is False
          assert x['dummy_wrong_cast_certified'] is False
          assert x['new_WCL_API_calls']==0
          print('REAL_WCL_NUMERIC_COMBATANTINFO',json.dumps({
              'actor_specID': b['observed_numeric_specID'],
              'gear_slots':b['observed_gear_slot_count'],
              'equipped_items':b['observed_gear_item_count'],
              'empty_slots':b['observed_gear_empty_slot_count'],
              'set_counts':b['observed_gear_setID_item_counts'],
              'talent_entries':b['observed_talent_entry_count'],
              'source_semantics':'UNKNOWN',
              'READY':'UNKNOWN'},sort_keys=True))
          PY
          sha256sum /tmp/actor-numeric-build-evidence.json
      - name: Retain compact numeric-only certificate without raw logs
        uses: actions/upload-artifact@v4
        with:
          name: zrot-gr-wcl-combatantinfo-numeric-only-${{ github.sha }}
          path: /tmp/actor-numeric-build-evidence.json
          retention-days: 7
          if-no-files-found: error
